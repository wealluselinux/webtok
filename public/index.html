<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Web Tok</title>
<style>
:root{
  --bg:#fff0ee; --surface:#ffe3e8; --card:#fbd5de; --primary:#7b3f8c; --on-primary:#fff;
  --text:#3b1f2b; --muted:#85626f; --accent:#ffd58a; --mint:#cfe8d5;
  --r-xl:32px; --r-lg:24px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#22141b; --surface:#33202a; --card:#47303c; --primary:#e7b6f2; --on-primary:#3a1745;
    --text:#f7dde5; --muted:#c3a1ae; --accent:#6b5320; --mint:#2e4a37}
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:"Google Sans","Roboto",system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
button{font:inherit;cursor:pointer;border:0;color:inherit}
.hidden{display:none!important}

/* landing */
#landing{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px;text-align:center;overflow:hidden}
#landing::before,#landing::after{content:"";position:absolute;z-index:-1;border-radius:50%}
#landing::before{width:60vmax;height:60vmax;background:var(--accent);top:-25vmax;right:-20vmax;opacity:.7;border-radius:48% 52% 40% 60%}
#landing::after{width:50vmax;height:50vmax;background:var(--card);bottom:-22vmax;left:-18vmax;border-radius:60% 40% 55% 45%}
.logo{font-size:clamp(44px,10vw,88px);font-weight:600;line-height:1;color:#8a3b3b}
@media (prefers-color-scheme:dark){.logo{color:var(--primary)}}
.tag{color:var(--muted);max-width:30ch}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{padding:16px 28px;border-radius:999px;font-weight:600;background:var(--surface)}
.btn.primary{background:var(--primary);color:var(--on-primary)}

/* feed */
#feed{position:fixed;inset:0;overflow-y:scroll;scroll-snap-type:y mandatory;background:var(--bg);scrollbar-width:none}
#feed::-webkit-scrollbar{display:none}
.slide{height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;position:relative;padding:72px 12px 16px}
.player{position:relative;height:100%;aspect-ratio:9/16;max-width:100%;border-radius:var(--r-xl);overflow:hidden;background:var(--card);box-shadow:0 8px 30px #0003}
.player video{width:100%;height:100%;object-fit:cover;display:block}
.cap{position:absolute;left:0;right:0;bottom:0;padding:48px 18px 18px;color:#fff;background:linear-gradient(transparent,#0008);font-weight:500;pointer-events:none;word-break:break-word}
.rail{position:absolute;right:max(8px,calc(50% - min(50%, 28dvh) - 80px));bottom:90px;display:flex;flex-direction:column;gap:14px;align-items:center}
@media (max-width:700px){.rail{right:22px;bottom:100px}}
.fab{width:56px;height:56px;border-radius:20px;background:var(--surface);display:grid;place-items:center;font-size:24px;box-shadow:0 2px 8px #0002}
.fab small{display:block;font-size:11px;margin-top:-4px;color:var(--muted)}
.fab.on{background:var(--primary);color:var(--on-primary)}
.fab:active{border-radius:28px}

/* top bar */
#bar{position:fixed;top:12px;left:12px;right:12px;z-index:5;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
#bar>*{pointer-events:auto}
.chip{padding:10px 18px;border-radius:999px;background:var(--surface);font-weight:600;box-shadow:0 2px 8px #0002}

/* dialogs */
dialog{border:0;border-radius:var(--r-xl);padding:26px;width:min(92vw,400px);background:var(--bg);color:var(--text);margin:auto}
dialog::backdrop{background:#0006}
dialog h2{margin-bottom:14px}
input{width:100%;padding:15px 18px;margin-bottom:10px;border-radius:var(--r-lg);border:2px solid transparent;background:var(--surface);color:var(--text);font:inherit}
input:focus{outline:0;border-color:var(--primary)}
#msg{min-height:20px;margin:4px 0 10px;color:var(--muted);font-size:14px}
.empty{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:30px;color:var(--muted)}
</style>
</head>
<body>

<section id="landing">
  <div class="logo">Web Tok</div>
  <p class="tag">Short videos. Scroll free, sign in to like and comment.</p>
  <div class="row">
    <button class="btn primary" id="start">Start scrolling</button>
    <button class="btn" id="signin">Sign in</button>
  </div>
</section>

<div id="bar" class="hidden">
  <button class="chip" id="home">Web Tok</button>
  <button class="chip" id="acct">Sign in</button>
</div>
<main id="feed" class="hidden"></main>

<dialog id="auth">
  <h2 id="atitle">Sign in</h2>
  <p id="areason" style="color:var(--muted);margin-bottom:12px"></p>
  <input id="email" type="email" placeholder="Email" autocomplete="email">
  <input id="pass" type="password" placeholder="Password" autocomplete="current-password">
  <div id="msg"></div>
  <div class="row" style="justify-content:space-between">
    <button class="btn" id="toggle">Create account</button>
    <button class="btn primary" id="go">Sign in</button>
  </div>
</dialog>

<dialog id="comments">
  <h2>Comments</h2>
  <p style="color:var(--muted);margin-bottom:14px">Comments are coming soon.</p>
  <button class="btn primary" onclick="document.getElementById('comments').close()">Close</button>
</dialog>

<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const { SUPABASE_URL, SUPABASE_ANON_KEY } = window.WT_CONFIG || {};

const $ = id => document.getElementById(id);
let sb = null, user = null, signup = false;
try { sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); } catch (e) { console.warn(e); }

/* ---------- auth ---------- */
function paintAuth(){
  $("acct").textContent = user ? "Sign out" : "Sign in";
}
async function initAuth(){
  if(!sb) return;
  try{
    const { data } = await sb.auth.getSession();
    user = data.session?.user || null; paintAuth();
    sb.auth.onAuthStateChange((_e, s) => { user = s?.user || null; paintAuth(); });
  }catch(e){ console.warn(e); }
}
function openAuth(reason){
  $("areason").textContent = reason || "";
  $("msg").textContent = "";
  $("auth").showModal();
}
function setMode(s){
  signup = s;
  $("atitle").textContent = s ? "Create account" : "Sign in";
  $("go").textContent = s ? "Sign up" : "Sign in";
  $("toggle").textContent = s ? "I have an account" : "Create account";
  $("pass").autocomplete = s ? "new-password" : "current-password";
}
$("toggle").onclick = () => setMode(!signup);
$("go").onclick = async () => {
  if(!sb) return $("msg").textContent = "Supabase isn't configured yet.";
  const email = $("email").value.trim(), password = $("pass").value;
  if(!email || !password) return $("msg").textContent = "Enter email and password.";
  $("msg").textContent = "Working…";
  try{
    const res = signup ? await sb.auth.signUp({ email, password }) : await sb.auth.signInWithPassword({ email, password });
    if(res.error) return $("msg").textContent = res.error.message;
    if(signup && !res.data.session){ return $("msg").textContent = "Check your email to confirm, then sign in."; }
    $("auth").close();
  }catch(e){ $("msg").textContent = "Something went wrong."; }
};
$("acct").onclick = async () => {
  if(user){ try{ await sb.auth.signOut(); }catch(e){} } else openAuth();
};
$("signin").onclick = () => { openAuth(); };
function requireLogin(reason, fn){ if(user) fn(); else openAuth(reason); }

/* ---------- feed ---------- */
let obs, muted = true;
async function listVideos(){
  const r = await fetch("/api/videos");
  if(!r.ok) throw new Error("Server " + r.status);
  return r.json();
}
function slide(v){
  const s = document.createElement("section");
  s.className = "slide";
  s.innerHTML = `<div class="player"><video loop playsinline muted preload="metadata"></video><div class="cap"></div></div>
    <div class="rail">
      <button class="fab" data-a="like" aria-label="Like">♡</button>
      <button class="fab" data-a="comment" aria-label="Comment">💬</button>
      <button class="fab" data-a="sound" aria-label="Sound">🔇</button>
    </div>`;
  const vid = s.querySelector("video");
  vid.src = v.src;
  s.querySelector(".cap").textContent = v.name;
  vid.onclick = () => vid.paused ? vid.play() : vid.pause();
  s.querySelector(".rail").onclick = e => {
    const b = e.target.closest("button"); if(!b) return;
    if(b.dataset.a === "like") requireLogin("Sign in to like videos.", () => {
      b.classList.toggle("on"); b.textContent = b.classList.contains("on") ? "♥" : "♡";
    });
    if(b.dataset.a === "comment") requireLogin("Sign in to comment.", () => $("comments").showModal());
    if(b.dataset.a === "sound"){ muted = !muted; document.querySelectorAll("video").forEach(x => x.muted = muted);
      document.querySelectorAll('[data-a=sound]').forEach(x => x.textContent = muted ? "🔇" : "🔊"); }
  };
  return s;
}
async function loadFeed(){
  const feed = $("feed");
  feed.innerHTML = '<div class="empty">Loading…</div>';
  try{
    const vids = await listVideos();
    if(!vids.length){ feed.innerHTML = `<div class="empty">No videos yet.<br>Add MP4s to the “videos” folder in the repo.</div>`; return; }
    feed.innerHTML = "";
    obs = new IntersectionObserver(es => es.forEach(e => {
      const v = e.target.querySelector("video");
      if(e.isIntersecting){ v.muted = muted; v.play().catch(()=>{}); } else { v.pause(); v.currentTime = 0; }
    }), { threshold: .7 });
    vids.forEach(v => { const s = slide(v); feed.appendChild(s); obs.observe(s); });
  }catch(e){
    feed.innerHTML = `<div class="empty">Couldn't load videos.<br>${e.message}</div>`;
  }
}

/* ---------- nav ---------- */
function showFeed(){
  $("landing").classList.add("hidden");
  $("bar").classList.remove("hidden");
  $("feed").classList.remove("hidden");
  loadFeed();
}
$("start").onclick = showFeed;
$("home").onclick = () => {
  $("feed").classList.add("hidden"); $("bar").classList.add("hidden");
  document.querySelectorAll("video").forEach(v => v.pause());
  $("landing").classList.remove("hidden");
};
initAuth();
</script>
</body>
</html>
