<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Web Tok</title>
<style>
:root{
  --bg:#fff0ee; --surface:#ffe3e8; --card:#fbd5de; --primary:#7b3f8c; --on-primary:#fff;
  --text:#3b1f2b; --muted:#85626f; --accent:#ffd58a; --mint:#cfe8d5; --bad:#b3261e;
  --r-xl:32px; --r-lg:24px; --r-md:18px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#22141b; --surface:#33202a; --card:#47303c; --primary:#e7b6f2; --on-primary:#3a1745;
    --text:#f7dde5; --muted:#c3a1ae; --accent:#6b5320; --mint:#2e4a37; --bad:#ffb4ab}
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:"Google Sans","Roboto",system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;transition:background-color .25s,color .25s}
#wp-layer{position:fixed;inset:0;z-index:-2;background-size:cover;background-position:center;opacity:0;pointer-events:none}
#wp-scrim{position:fixed;inset:0;z-index:-1;background:var(--bg);opacity:0;pointer-events:none}
body.has-wp #wp-layer{opacity:1}
body.has-wp #wp-scrim{opacity:.76}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
.hidden{display:none!important}

/* landing */
#landing{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px;text-align:center;overflow:hidden}
#landing::before,#landing::after{content:"";position:absolute;z-index:-1;border-radius:50%}
#landing::before{width:60vmax;height:60vmax;background:var(--accent);top:-25vmax;right:-20vmax;opacity:.65;border-radius:48% 52% 40% 60%}
#landing::after{width:50vmax;height:50vmax;background:var(--card);bottom:-22vmax;left:-18vmax;opacity:.85;border-radius:60% 40% 55% 45%}
.logo{font-size:clamp(44px,10vw,88px);font-weight:700;line-height:1;color:var(--primary)}
.tag{color:var(--muted);max-width:32ch}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{padding:14px 24px;border-radius:999px;font-weight:600;background:var(--surface);color:var(--text)}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.sm{padding:10px 18px;font-size:14px}
.btn.icon{width:42px;height:42px;padding:0;display:grid;place-items:center;border-radius:16px;background:var(--surface)}
.btn:disabled{opacity:.45;cursor:default}

/* feed */
#feed{position:fixed;inset:0;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
#feed::-webkit-scrollbar{display:none}
.slide{height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;position:relative;padding:72px 12px 16px}
.player{position:relative;height:100%;aspect-ratio:9/16;max-width:100%;border-radius:var(--r-xl);overflow:hidden;background:var(--card);box-shadow:0 8px 30px #0003}
.player video{width:100%;height:100%;object-fit:cover;display:block}
.cap{position:absolute;left:0;right:0;bottom:0;padding:48px 18px 18px;color:#fff;background:linear-gradient(transparent,#0009);font-weight:500;pointer-events:none;word-break:break-word}
.cap small{display:block;font-size:12px;opacity:.85;margin-top:3px}
.rail{position:absolute;right:max(8px,calc(50% - min(50%, 28dvh) - 80px));bottom:90px;display:flex;flex-direction:column;gap:12px;align-items:center}
@media (max-width:700px){.rail{right:22px;bottom:100px}}
.fab{width:56px;height:56px;border-radius:20px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:21px;box-shadow:0 2px 10px #0002;transition:border-radius .15s,background .15s}
.fab small{display:block;font-size:11px;line-height:1;margin-top:2px;color:var(--muted);font-weight:600}
.fab.on{background:var(--primary);color:var(--on-primary)}
.fab.on small{color:var(--on-primary)}
.fab:active{border-radius:28px}

/* top bar */
#bar{position:fixed;top:12px;left:12px;right:12px;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none}
#bar>*{pointer-events:auto}
.bar-right{display:flex;align-items:center;gap:8px}
.chip{padding:9px 16px;border-radius:999px;background:var(--surface);font-weight:600;box-shadow:0 2px 10px #0002;display:inline-flex;align-items:center;gap:8px}
.chip.p{background:var(--primary);color:var(--on-primary)}
.mini-av{width:24px;height:24px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-size:12px;font-weight:700;background-size:cover;background-position:center;flex-shrink:0}

/* dialogs */
dialog{border:0;border-radius:var(--r-xl);padding:24px;width:min(94vw,440px);background:var(--bg);color:var(--text);margin:auto;box-shadow:0 12px 40px #0004}
dialog::backdrop{background:#0007;backdrop-filter:blur(3px)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.dlg-head h2{font-size:20px;font-weight:700}
label.fld{display:block;font-size:13px;color:var(--muted);margin:10px 4px 5px}
input[type=text]{width:100%;padding:14px 16px;border-radius:var(--r-lg);border:2px solid transparent;background:var(--surface);color:var(--text);font:inherit}
input:focus{outline:0;border-color:var(--primary)}
.hint{min-height:18px;margin:8px 4px;color:var(--muted);font-size:13px}
.hint.bad{color:var(--bad)}
.empty{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:30px;color:var(--muted)}
.cmt-list{max-height:46vh;overflow-y:auto;display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.cmt-item{display:flex;gap:10px;align-items:flex-start;background:var(--surface);padding:10px 14px;border-radius:var(--r-md)}
.cmt-form{display:flex;gap:8px;align-items:center}
.cmt-form input{flex:1}

/* ---------- Landing ---------- */
#landing{display:grid!important;place-items:center;padding:28px;overflow:auto;gap:0}
#landing::before,#landing::after{display:none!important}
#landing.hidden{display:none!important}
#landing .blob{position:absolute;z-index:-1;pointer-events:none;animation:drift 18s ease-in-out infinite alternate}
.b1{width:56vmax;height:56vmax;background:var(--accent);top:-22vmax;right:-14vmax;border-radius:48% 52% 40% 60%;opacity:.75}
.b2{width:44vmax;height:44vmax;background:var(--card);bottom:-20vmax;left:-12vmax;border-radius:60% 40% 55% 45%;animation-delay:-6s!important}
.b3{width:22vmax;height:22vmax;background:var(--surface);top:30%;left:34%;border-radius:42% 58% 63% 37%;opacity:.8;animation-delay:-11s!important}
@keyframes drift{to{transform:translate(3vmax,2vmax) rotate(14deg) scale(1.06)}}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;max-width:1040px;width:100%}
.copy{text-align:left}
.brand-row{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.brand-row .logo{font-size:30px!important}
#landing h1{font-size:clamp(42px,7vw,84px);line-height:1;font-weight:700;letter-spacing:-.03em;margin-bottom:16px}
#landing h1 em{font-style:normal;color:var(--primary)}
#landing .tag{max-width:46ch;font-size:17px;margin-bottom:26px}
.btn.big{padding:18px 30px;font-size:16px;display:inline-flex;align-items:center;gap:8px;box-shadow:0 6px 18px #0002;transition:transform .15s,border-radius .2s}
.btn.big:hover{transform:translateY(-2px);border-radius:20px}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.chips span{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:999px;background:var(--surface);font-size:14px;font-weight:600}
.chips .ms{font-size:18px;color:var(--primary)}
.art{position:relative;height:min(62vh,520px);display:grid;place-items:center}
.phone{position:relative;height:100%;aspect-ratio:9/16;border-radius:36px;background:linear-gradient(160deg,var(--primary),var(--accent) 120%);box-shadow:0 20px 50px #0004;display:grid;place-items:center;overflow:hidden;transform:rotate(3deg);animation:float 6s ease-in-out infinite alternate}
.phone .play{font-size:84px;color:var(--on-primary);background:#fff3;border-radius:50%;padding:12px;font-variation-settings:'FILL' 1}
.bars{position:absolute;left:18px;right:18px;bottom:22px;display:grid;gap:8px}
.bars i{height:10px;border-radius:9px;background:#fff6}.bars i:nth-child(2){width:70%}.bars i:nth-child(3){width:45%}
.fl{position:absolute;display:flex;align-items:center;gap:8px;padding:12px 18px;border-radius:24px;background:var(--surface);font-weight:700;box-shadow:0 8px 24px #0003;animation:float 5s ease-in-out infinite alternate}
.fl .ms{color:var(--primary);font-variation-settings:'FILL' 1}
.f1{top:12%;left:-2%}.f2{top:46%;right:-4%;animation-delay:-2s;border-radius:30px 12px 30px 12px}.f3{bottom:10%;left:2%;animation-delay:-3.5s}
@keyframes float{to{transform:translateY(-14px) rotate(-1deg)}}
@media(max-width:800px){.hero{grid-template-columns:1fr;text-align:center}.copy{text-align:center}.brand-row,.chips,#landing .row{justify-content:center}.art{height:300px}#landing .tag{margin-inline:auto}}
@media(prefers-reduced-motion:reduce){#landing *{animation:none!important}}

/* ---------- Comments side panel ---------- */
#commentsDlg{position:fixed;inset:12px 12px 12px auto;margin:0;width:min(400px,calc(100vw - 24px));height:calc(100dvh - 24px);max-height:none;border:0;border-radius:28px;padding:0;background:var(--bg);color:var(--text);box-shadow:0 10px 40px #0005;z-index:40;overflow:hidden}
#commentsDlg[open]{display:flex;flex-direction:column}
#commentsDlg .dlg-head{padding:18px 20px 10px;display:flex;justify-content:space-between;align-items:center}
#commentsDlg .cmt-list{flex:1;overflow-y:auto;padding:0 16px}
#commentsDlg .cmt-form{display:flex;gap:8px;align-items:center;padding:12px 14px}
#commentsDlg .cmt-form input{flex:1;min-width:0}
.cmt-stk{width:120px;height:120px;object-fit:contain;margin-top:6px;display:block}
.cmt-meta{font-size:12px;color:var(--muted);margin-top:4px}
#stkPanel{max-height:190px;overflow-y:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px 14px;background:var(--surface)}
#stkPanel button{background:none;border:0;cursor:pointer;border-radius:16px;padding:4px}
#stkPanel button:hover{background:var(--card)}#stkPanel img{width:100%;aspect-ratio:1;object-fit:contain;display:block}
#vnav{position:fixed;right:24px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px;z-index:12}
#vnav button{width:48px;height:48px;border-radius:50%;border:0;background:var(--surface);color:var(--text);cursor:pointer;display:grid;place-items:center}
#feed.hidden ~ #vnav{display:none}
body.cmt-open #feed{right:min(412px,100vw)}
body.cmt-open #vnav{right:424px}
@media(max-width:800px){#commentsDlg{inset:auto 0 0 0;width:100%;height:70dvh;border-radius:28px 28px 0 0}body.cmt-open #feed{right:0}#vnav{display:none}}
</style>

<div id="bar" class="hidden">

</dialog>

<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/sidebar.js"></script>
<script>
const { SUPABASE_URL, SUPABASE_ANON_KEY } = window.WT_CONFIG || {};
const $ = id => document.getElementById(id);
let sb = null, user = null, profile = null;
try { sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); } catch (e) { console.warn(e); }

/* ---------- Material You Theme ---------- */
function hexToHsl(hex) {
  let r = parseInt(hex.slice(1,3),16)/255, g = parseInt(hex.slice(3,5),16)/255, b = parseInt(hex.slice(5,7),16)/255;
  const max = Math.max(r,g,b), min = Math.min(r,g,b);
  let h = 0, s = 0;
  if (max !== min) {
    const d = max - min, l = (max+min)/2;
    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
    if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h /= 6;
  }
  return [Math.round(h*360), Math.round(s*100)];
}
function applyTheme(t) {
  if (!t) { try { t = JSON.parse(localStorage.getItem("wt_theme") || "{}"); } catch { t = {}; } }
  if (!t.color && !t.mode && !t.wallpaper) return;
  const root = document.documentElement;
  const sysDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  const isDark = t.mode === "dark" ? true : t.mode === "light" ? false : sysDark;
  const [h, s] = hexToHsl(t.color || "#7b3f8c");
  const sat = Math.min(Math.max(s, 22), 58);
  if (isDark) {
    root.style.setProperty("--bg", `hsl(${h}, ${Math.round(sat*0.45)}%, 10%)`);
    root.style.setProperty("--surface", `hsl(${h}, ${Math.round(sat*0.45)}%, 16%)`);
    root.style.setProperty("--card", `hsl(${h}, ${Math.round(sat*0.42)}%, 23%)`);
    root.style.setProperty("--primary", `hsl(${h}, ${Math.min(sat+18,80)}%, 80%)`);
    root.style.setProperty("--on-primary", `hsl(${h}, ${sat}%, 18%)`);
    root.style.setProperty("--text", `hsl(${h}, 30%, 92%)`);
    root.style.setProperty("--muted", `hsl(${h}, 20%, 72%)`);
    root.style.setProperty("--accent", `hsl(${(h+45)%360}, 40%, 28%)`);
  } else {
    root.style.setProperty("--bg", `hsl(${h}, ${Math.round(sat*0.6)}%, 96%)`);
    root.style.setProperty("--surface", `hsl(${h}, ${Math.round(sat*0.6)}%, 91%)`);
    root.style.setProperty("--card", `hsl(${h}, ${Math.round(sat*0.58)}%, 88%)`);
    root.style.setProperty("--primary", `hsl(${h}, ${sat}%, 38%)`);
    root.style.setProperty("--on-primary", "#ffffff");
    root.style.setProperty("--text", `hsl(${h}, 35%, 16%)`);
    root.style.setProperty("--muted", `hsl(${h}, 18%, 42%)`);
    root.style.setProperty("--accent", `hsl(${(h+45)%360}, 85%, 78%)`);
  }
  const wp = $("wp-layer");
  if (t.wallpaper) {
    document.body.classList.add("has-wp");
    wp.style.backgroundImage = t.wallpaper.startsWith("url(") || t.wallpaper.includes("gradient") ? t.wallpaper : `url(${t.wallpaper})`;
  } else {
    document.body.classList.remove("has-wp");
    wp.style.backgroundImage = "";
  }
}
applyTheme();

/* ---------- Auth ---------- */
async function loadProfile() {
  if (!sb || !user) { profile = null; return; }
  const meta = user.user_metadata || {};
  let row = null;
  try {
    const { data } = await sb.from("profiles").select("*").eq("id", user.id).single();
    row = data;
  } catch {}
  profile = {
    id: user.id,
    username: row?.username || meta.username || (user.email || "user").split("@")[0],
    display_name: row?.display_name || meta.display_name || meta.username || "Web Tok User",
    avatar_url: row?.avatar_url || null
  };
  if (row?.theme && Object.keys(row.theme).length) {
    try { localStorage.setItem("wt_theme", JSON.stringify(row.theme)); } catch {}
    applyTheme(row.theme);
  }
}
function paintAuth() {
  const acctBtn = $("acct"), upBtn = $("openUpload"), signinBtn = $("signin");
  if (user) {
    const label = profile?.username ? `@${profile.username}` : "Account";
    const initial = (profile?.display_name || profile?.username || "U")[0].toUpperCase();
    const avStyle = profile?.avatar_url ? `style="background-image:url(${profile.avatar_url})"` : "";
    acctBtn.innerHTML = `<span class="mini-av" ${avStyle}>${profile?.avatar_url ? "" : initial}</span><span>${label}</span>`;
    upBtn.classList.remove("hidden");
    signinBtn.textContent = "My account";
  } else {
    acctBtn.textContent = "Sign in";
    upBtn.classList.add("hidden");
    signinBtn.textContent = "Sign in";
  }
}
async function initAuth() {
  if (!sb) return;
  try {
    const { data } = await sb.auth.getSession();
    user = data.session?.user || null;
    await loadProfile(); await loadSocial();
    paintAuth();
    sb.auth.onAuthStateChange(async (_e, s) => {
      user = s?.user || null;
      await loadProfile(); await loadSocial();
      paintAuth();
    });
  } catch (e) { console.warn(e); }
}
function openAuth() { location.href = "/login"; }
$("acct").onclick = () => { location.href = user ? "/profile" : "/login"; };
$("signin").onclick = () => { location.href = user ? "/profile" : "/login"; };
function requireLogin(fn) { if (user) fn(); else openAuth(); }

/* ---------- Feed (Supabase) ---------- */
let obs, muted = true;
async function listVideos() {
  if (!sb) return [];
  let { data: vids, error } = await sb
    .from("videos")
    .select("id, user_id, title, video_url, created_at")
    .order("created_at", { ascending: false });
  if (error) throw error;
  if (!vids || !vids.length) return [];

  const userIds = [...new Set(vids.map(v => v.user_id))];
  const vidIds = vids.map(v => v.id);

  const [profRes, likeRes, cmtRes] = await Promise.all([
    sb.from("profiles").select("id, username, display_name").in("id", userIds),
    sb.from("likes").select("video_id, user_id").in("video_id", vidIds),
    sb.from("comments").select("video_id").in("video_id", vidIds)
  ]);

  const profMap = Object.fromEntries((profRes.data || []).map(p => [p.id, p]));
  const likeCounts = {}, likedSet = new Set(), cmtCounts = {};
  (likeRes.data || []).forEach(l => {
    likeCounts[l.video_id] = (likeCounts[l.video_id] || 0) + 1;
    if (user && l.user_id === user.id) likedSet.add(l.video_id);
  });
  (cmtRes.data || []).forEach(c => {
    cmtCounts[c.video_id] = (cmtCounts[c.video_id] || 0) + 1;
  });

  return filterMode(vids.map(v => ({
    id: v.id,
    user_id: v.user_id,
    name: v.title,
    src: v.video_url,
    username: profMap[v.user_id]?.username || null,
    likesCount: likeCounts[v.id] || 0,
    commentsCount: cmtCounts[v.id] || 0,
    likedByMe: likedSet.has(v.id)
  })));
}

function slide(v) {
  const s = document.createElement("section");
  s.className = "slide";
  const by = v.username ? `<small>@${escapeHtml(v.username)}</small>` : "";
  s.innerHTML = `<div class="player"><video loop playsinline muted preload="metadata"></video><div class="cap"><span class="cap-t"></span>${by}</div></div>
    <div class="rail">
      ${followBtn(v)}
      <button class="fab ${v.likedByMe ? "on" : ""}" data-a="like" aria-label="Like"><span class="ms">favorite</span><small>${v.likesCount || 0}</small></button>
      <button class="fab" data-a="comment" aria-label="Comment"><span class="ms">chat_bubble</span><small>${v.commentsCount || 0}</small></button>
      <button class="fab" data-a="sound" aria-label="Sound"><span class="ms">${muted ? "volume_off" : "volume_up"}</span><small>${muted ? "Muted" : "Sound"}</small></button>
    </div>`;
  const vid = s.querySelector("video");
  vid.src = v.src;
  s.querySelector(".cap-t").textContent = v.name;
  vid.onclick = () => vid.paused ? vid.play() : vid.pause();
  s.querySelector(".rail").onclick = e => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.a === "follow") requireLogin(async () => {
      const id = v.user_id, was = following.has(id);
      const { error } = was ? await sb.from("follows").delete().eq("follower_id", user.id).eq("following_id", id)
                            : await sb.from("follows").insert({ follower_id: user.id, following_id: id });
      if (error) return;
      was ? following.delete(id) : following.add(id);
      document.querySelectorAll(`[data-follow="${id}"]`).forEach(paintFollow);
    });
    if (b.dataset.a === "like") requireLogin(async () => {
      if (v.likedByMe) {
        const { error } = await sb.from("likes").delete().eq("video_id", v.id).eq("user_id", user.id);
        if (error) return;
        v.likedByMe = false; v.likesCount = Math.max(0, v.likesCount - 1);
      } else {
        const { error } = await sb.from("likes").insert({ video_id: v.id, user_id: user.id });
        if (error) return;
        v.likedByMe = true; v.likesCount += 1;
      }
      b.classList.toggle("on", v.likedByMe);
      b.querySelector("small").textContent = v.likesCount;
    });
    if (b.dataset.a === "comment") openComments(v, b);
    if (b.dataset.a === "sound") {
      muted = !muted;
      document.querySelectorAll("video").forEach(x => x.muted = muted);
      document.querySelectorAll('[data-a=sound]').forEach(btn => {
        btn.querySelector("span").textContent = muted ? "volume_off" : "volume_up";
        btn.querySelector("small").textContent = muted ? "Muted" : "Sound";
      });
    }
  };
  return s;
}

async function loadFeed() {
  const feed = $("feed");
  feed.innerHTML = '<div class="empty"><div>Loading…</div></div>';
  try {
    const vids = await listVideos();
    if (!vids.length) {
      const h = location.hash;
      const msg = h === "#following" ? "You're not following anyone with videos yet.<br>Tap <b>Follow</b> on a video to see them here."
        : h === "#friends" ? "No videos from friends yet.<br>Follow someone and have them follow you back to become friends."
        : h.startsWith("#search=") ? "No results found."
        : "No videos yet.<br>Click <b>+ Upload</b> to post the first one!";
      feed.innerHTML = `<div class="empty"><div>${msg}</div></div>`;
      return;
    }
    feed.innerHTML = "";
    obs = new IntersectionObserver(es => es.forEach(e => {
      const v = e.target.querySelector("video");
      if (e.isIntersecting) { v.muted = muted; v.play().catch(() => {}); }
      else { v.pause(); v.currentTime = 0; }
    }), { threshold: .7 });
    vids.forEach(v => { const s = slide(v); feed.appendChild(s); obs.observe(s); });
  } catch (e) {
    feed.innerHTML = `<div class="empty"><div>Couldn't load videos.<br>${e.message}</div></div>`;
  }
}

/* ---------- Comments (Supabase) ---------- */
let activeVideo = null, activeCommentBtn = null;
async function openComments(v, btn) {
  activeVideo = v;
  activeCommentBtn = btn;
  $("cmtHint").textContent = "";
  $("cmtInput").value = "";
  $("cmtList").innerHTML = '<div style="color:var(--muted);padding:12px">Loading comments…</div>';
  $("cmtCount").textContent = v.commentsCount || ""; $("stkPanel").classList.add("hidden"); document.body.classList.add("cmt-open"); $("commentsDlg").show();
  await fetchAndRenderComments();
}
async function fetchAndRenderComments() {
  const { data: list, error } = await sb
    .from("comments")
    .select("id, user_id, text, created_at")
    .eq("video_id", activeVideo.id)
    .order("created_at", { ascending: true });
  if (error) { $("cmtList").innerHTML = '<div style="color:var(--bad);padding:12px">Could not load comments.</div>'; return; }
  if (!list.length) { $("cmtList").innerHTML = '<div style="color:var(--muted);padding:12px">No comments yet. Be the first!</div>'; return; }

  const uids = [...new Set(list.map(c => c.user_id))];
  const { data: profs } = await sb.from("profiles").select("id, username, display_name, avatar_url").in("id", uids);
  const pmap = Object.fromEntries((profs || []).map(p => [p.id, p]));

  const box = $("cmtList");
  box.innerHTML = "";
  list.forEach(c => {
    const p = pmap[c.user_id] || {};
    const uname = p.username || "user";
    const dname = p.display_name || uname;
    const init = dname[0].toUpperCase();
    const av = p.avatar_url ? `style="background-image:url(${p.avatar_url})"` : "";
    const item = document.createElement("div");
    item.className = "cmt-item";
    item.innerHTML = `<div class="mini-av" ${av}>${p.avatar_url ? "" : init}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:700">${escapeHtml(dname)} <span style="color:var(--muted);font-weight:400">@${escapeHtml(uname)}</span></div>
        ${commentBody(c.text)}<div class="cmt-meta">${timeAgo(c.created_at)}</div>
      </div>`;
    box.appendChild(item);
  });
}
$("cmtForm").onsubmit = e => {
  e.preventDefault();
  requireLogin(async () => {
    const text = $("cmtInput").value.trim();
    if (!text) return;
    $("cmtHint").textContent = "Posting…";
    const { error } = await sb.from("comments").insert({
      video_id: activeVideo.id, user_id: user.id, text
    });
    if (error) { $("cmtHint").textContent = error.message; return; }
    $("cmtInput").value = "";
    $("cmtHint").textContent = "";
    activeVideo.commentsCount += 1;
    if (activeCommentBtn) activeCommentBtn.querySelector("small").textContent = activeVideo.commentsCount;
    await fetchAndRenderComments();
  });
};

/* ---------- Upload with live progress & error handling ---------- */
function uploadToBucket(storagePath, file, token, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open("POST", `${SUPABASE_URL}/storage/v1/object/videos/${storagePath}`);
    xhr.setRequestHeader("apikey", SUPABASE_ANON_KEY);
    xhr.setRequestHeader("Authorization", `Bearer ${token}`);
    xhr.setRequestHeader("Content-Type", file.type || "video/mp4");
    xhr.setRequestHeader("x-upsert", "true");
    xhr.timeout = 120000;
    xhr.upload.onprogress = e => {
      if (e.lengthComputable && onProgress) onProgress(Math.round((e.loaded / e.total) * 100));
    };
    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) resolve();
      else {
        let msg = `Upload failed (${xhr.status})`;
        try { msg = JSON.parse(xhr.responseText).message || msg; } catch {}
        reject(new Error(msg));
      }
    };
    xhr.onerror = () => reject(new Error("Network error during upload."));
    xhr.ontimeout = () => reject(new Error("Upload timed out. Try a smaller video."));
    xhr.send(file);
  });
}

$("openUpload").onclick = () => requireLogin(() => {
  $("upFile").value = ""; $("upTitle").value = ""; $("upHint").textContent = "";
  $("upHint").className = "hint"; $("upSubmit").disabled = false;
  $("uploadDlg").showModal();
});
$("upSubmit").onclick = async () => {
  const file = $("upFile").files[0];
  if (!file) { $("upHint").textContent = "Pick a video file first."; $("upHint").className = "hint bad"; return; }
  if (file.size > 50 * 1024 * 1024) {
    $("upHint").textContent = "Video is over 50 MB (Supabase free-tier limit).";
    $("upHint").className = "hint bad";
    return;
  }
  $("upSubmit").disabled = true; $("upHint").textContent = "Starting upload…"; $("upHint").className = "hint";
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session?.access_token) throw new Error("Session expired. Sign in again.");
    const ext = (file.name.match(/\.(mp4|webm|mov)$/i)?.[0] || ".mp4").toLowerCase();
    const safe = file.name.replace(/\.[^.]+$/, "").replace(/[^a-zA-Z0-9_-]+/g, "-").slice(0, 40) || "video";
    const storagePath = `${user.id}/${Date.now()}-${safe}${ext}`;
    await uploadToBucket(storagePath, file, session.access_token, pct => {
      $("upHint").textContent = `Uploading… ${pct}%`;
    });
    $("upHint").textContent = "Saving post…";
    const videoUrl = sb.storage.from("videos").getPublicUrl(storagePath).data.publicUrl;
    const title = $("upTitle").value.trim() || safe.replace(/[-_]+/g, " ");
    const { error: dbErr } = await sb.from("videos").insert({
      user_id: user.id, title, video_url: videoUrl, storage_path: storagePath
    });
    if (dbErr) throw dbErr;
    $("uploadDlg").close();
    await loadFeed();
  } catch (e) {
    $("upSubmit").disabled = false; $("upHint").textContent = e.message; $("upHint").className = "hint bad";
  }
};

function escapeHtml(s) {
  return String(s || "").replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
}

/* ---------- Navigation ---------- */
function showFeed() {
  $("landing").classList.add("hidden");
  $("bar").classList.remove("hidden");
  $("feed").classList.remove("hidden");
  loadFeed();
}
$("start").onclick = showFeed;
$("home").onclick = () => {
  $("feed").classList.add("hidden"); $("bar").classList.add("hidden");
  document.querySelectorAll("video").forEach(v => v.pause());
  $("landing").classList.remove("hidden");
};
/* ---------- Comments panel: stickers, time, up/down ---------- */
$("commentsDlg").addEventListener("close", () => document.body.classList.remove("cmt-open"));
function commentBody(tx) {
  const m = /^\[sticker:([\w.\- ]+\.(?:png|gif|webp|jpe?g|svg))\]$/i.exec(tx || "");
  if (m) return `<img class="cmt-stk" src="/stickers/${encodeURIComponent(m[1])}" alt="sticker">`;
  return `<div class="cmt-t">${escapeHtml(tx || "")}</div>`;
}
function timeAgo(iso) {
  const s = Math.max(1, (Date.now() - new Date(iso)) / 1000);
  for (const [n, l] of [[31536000, "y"], [2592000, "mo"], [604800, "w"], [86400, "d"], [3600, "h"], [60, "m"]]) if (s >= n) return Math.floor(s / n) + l + " ago";
  return "just now";
}
async function postComment(text) {
  requireLogin(async () => {
    $("cmtHint").textContent = "Posting…";
    const { error } = await sb.from("comments").insert({ video_id: activeVideo.id, user_id: user.id, text });
    if (error) { $("cmtHint").textContent = error.message; return; }
    $("cmtHint").textContent = "";
    activeVideo.commentsCount += 1;
    $("cmtCount").textContent = activeVideo.commentsCount;
    if (activeCommentBtn) activeCommentBtn.querySelector("small").textContent = activeVideo.commentsCount;
    await fetchAndRenderComments();
    $("cmtList").scrollTop = 1e9;
  });
}
$("cmtForm").onsubmit = e => {
  e.preventDefault();
  const tx = $("cmtInput").value.trim();
  if (!tx) return;
  $("cmtInput").value = "";
  postComment(tx);
};
let stickersLoaded = false;
$("stkBtn").onclick = async () => {
  const pn = $("stkPanel");
  pn.classList.toggle("hidden");
  if (stickersLoaded || pn.classList.contains("hidden")) return;
  stickersLoaded = true;
  try {
    const list = await (await fetch("/api/stickers")).json();
    pn.innerHTML = list.length ? "" : '<div style="grid-column:1/-1;color:var(--muted);padding:8px">No stickers yet.</div>';
    list.forEach(f => {
      const b = document.createElement("button");
      b.type = "button";
      b.innerHTML = `<img src="/stickers/${encodeURIComponent(f)}" alt="" loading="lazy">`;
      b.onclick = () => { pn.classList.add("hidden"); postComment(`[sticker:${f}]`); };
      pn.appendChild(b);
    });
  } catch { stickersLoaded = false; pn.innerHTML = '<div style="grid-column:1/-1;color:var(--muted);padding:8px">Couldn\'t load stickers.</div>'; }
};
$("vprev").onclick = () => $("feed").scrollBy({ top: -$("feed").clientHeight, behavior: "smooth" });
$("vnext").onclick = () => $("feed").scrollBy({ top: $("feed").clientHeight, behavior: "smooth" });

/* ---------- Social: follow / friends / search ---------- */
let following = new Set(), followedBy = new Set();
const friendIds = () => [...following].filter(id => followedBy.has(id));
async function loadSocial() {
  following = new Set(); followedBy = new Set();
  if (!sb || !user) return;
  const [a, b] = await Promise.all([
    sb.from("follows").select("following_id").eq("follower_id", user.id),
    sb.from("follows").select("follower_id").eq("following_id", user.id)]);
  (a.data || []).forEach(r => following.add(r.following_id));
  (b.data || []).forEach(r => followedBy.add(r.follower_id));
}
function followBtn(v) {
  if (!v.user_id || (user && v.user_id === user.id)) return "";
  return `<button class="fab" data-a="follow" data-follow="${v.user_id}"><span class="ms">person_add</span><small>Follow</small></button>`;
}
function paintFollow(b) {
  const id = b.dataset.follow, f = following.has(id);
  b.classList.toggle("on", f);
  b.querySelector("span").textContent = f ? "how_to_reg" : "person_add";
  b.querySelector("small").textContent = f ? (followedBy.has(id) ? "Friends" : "Following") : "Follow";
}
function filterMode(list) {
  const h = location.hash;
  if (h === "#following") return list.filter(v => following.has(v.user_id));
  if (h === "#friends") { const f = new Set(friendIds()); return list.filter(v => f.has(v.user_id)); }
  if (h.startsWith("#search=")) {
    const q = decodeURIComponent(h.slice(8)).toLowerCase();
    return list.filter(v => (v.name || "").toLowerCase().includes(q) || (v.username || "").toLowerCase().includes(q));
  }
  return list;
}
const FEED_HASH = /^#(feed|following|friends|search=)/;
addEventListener("hashchange", () => {
  if (!FEED_HASH.test(location.hash)) return;
  if ($("feed").classList.contains("hidden")) showFeed(); else loadFeed();
});
const _lf = loadFeed;
loadFeed = async function () { await _lf(); document.querySelectorAll("[data-follow]").forEach(paintFollow); };
initAuth().then(() => { if (FEED_HASH.test(location.hash)) showFeed(); });
</script>
