<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Web Tok</title>
<link rel="icon" href="/logo.png">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/landing.css">
</head>
<body data-page="landing">
<div id="wp-layer"></div>
<div id="wp-scrim"></div>
<section id="landing">
  <i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i>
  <div class="hero">
    <div class="copy">
      <div class="brand-row"><img src="/logo.png" alt="" width="40" height="40"><span class="logo">Web Tok</span></div>
      <h1>Short videos.<br><em>Big</em> vibes.</h1>
      <p class="tag">Scroll for free. Make an account to like, comment, follow, chat with friends and post your own.</p>
      <div class="row">
        <button class="btn primary big" id="start"><span class="ms">play_arrow</span>Start scrolling</button>
        <button class="btn big" id="signin">Sign in</button>
      </div>
      <div class="chips"><span><i class="ms">favorite</i>Like</span><span><i class="ms">group</i>Friends</span><span><i class="ms">chat_bubble</i>Chat</span><span><i class="ms">palette</i>Your theme</span></div>
    </div>
    <div class="art" aria-hidden="true">
      <div class="phone"><span class="ms play">play_arrow</span><div class="bars"><i></i><i></i><i></i></div></div>
      <div class="fl f1"><span class="ms">favorite</span>2.4k</div>
      <div class="fl f2"><span class="ms">chat_bubble</span>318</div>
      <div class="fl f3"><span class="ms">group</span>Friends</div>
    </div>
  </div>
</section>
<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/sidebar.js"></script>
<script src="/js/core.js"></script>
<script src="/js/theme.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/landing.js"></script>
</body>
</html>
