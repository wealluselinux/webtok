<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Web Tok · Activity</title>
<link rel="icon" href="/images/logo.png">
<link rel="stylesheet" href="/css/base.css">
<style>
body{overflow:auto;padding:24px 16px 80px}
.wrap{max-width:720px;margin:0 auto;padding-left:var(--sbw,0px);display:flex;flex-direction:column;gap:14px}
@media(max-width:800px){.wrap{padding-left:0}}
h1{font-size:28px;font-weight:700;margin-bottom:4px;letter-spacing:-.3px}
.act-card{display:flex;align-items:center;gap:14px;background:var(--card);padding:16px 18px;border-radius:var(--r-xl);box-shadow:0 4px 16px #0001;transition:transform .18s var(--spring)}
.act-card:hover{transform:translateY(-1px)}
.act-av{width:46px;height:46px;border-radius:38% 62% 55% 45%/45% 38% 62% 55%;background:var(--surface) center/cover;display:grid;place-items:center;font-weight:700;color:var(--primary);flex-shrink:0}
.act-body{flex:1;min-width:0;font-size:14px;line-height:1.4}
.act-body a{color:inherit;font-weight:700;text-decoration:none}
.act-body a:hover{text-decoration:underline}
.act-body small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.empty-box{background:var(--surface);border-radius:var(--r-xl);padding:36px 20px;text-align:center;color:var(--muted);font-weight:600}
</style>
</head>
<body data-page="activity">
<div id="wp-layer"></div>
<div id="wp-scrim"></div>
<main class="wrap">
  <h1>Activity</h1>
  <div id="act-list">
    <div class="empty-box m3-loader">
      <div class="m3-wave"><svg viewBox="0 0 160 14" fill="none"><path d="M0 7 Q10 1 20 7 T40 7 T60 7 T80 7 T100 7 T120 7 T140 7 T160 7" stroke="var(--primary)" stroke-width="3.2" stroke-linecap="round"/></svg></div>
      <span>Loading activity…</span>
    </div>
  </div>
</main>
<script src="/config.js"></script>
<script src="/js/wt-local.js"></script>
<script src="/js/sidebar.js"></script>
<script src="/js/core.js"></script>
<script src="/js/theme.js"></script>
<script>
function timeAgo(iso) {
  const s = Math.max(1, (Date.now() - new Date(iso)) / 1000);
  for (const [n, l] of [[31536000,"y"],[2592000,"mo"],[604800,"w"],[86400,"d"],[3600,"h"],[60,"m"]]) if (s >= n) return Math.floor(s / n) + l + " ago";
  return "just now";
}

(async () => {
  if (!sb) return location.href = "/login";
  const { data } = await sb.auth.getSession();
  user = data.session?.user || null;
  if (!user) return location.href = "/login";

  const [myVidsRes, followersRes, myFollowingRes] = await Promise.all([
    sb.from("videos").select("id, title").eq("user_id", user.id),
    sb.from("follows").select("follower_id, created_at").eq("following_id", user.id).order("created_at", { ascending: false }).limit(40),
    sb.from("follows").select("following_id").eq("follower_id", user.id)
  ]);

  const myVids = myVidsRes.data || [];
  const vidMap = Object.fromEntries(myVids.map(v => [v.id, v.title]));
  const vidIds = myVids.map(v => v.id);
  const myFollowing = new Set((myFollowingRes.data || []).map(r => r.following_id));

  const [likesRes, cmtsRes] = await Promise.all([
    vidIds.length ? sb.from("likes").select("video_id, user_id, created_at").in("video_id", vidIds).neq("user_id", user.id).order("created_at", { ascending: false }).limit(40) : { data: [] },
    vidIds.length ? sb.from("comments").select("video_id, user_id, text, created_at").in("video_id", vidIds).neq("user_id", user.id).order("created_at", { ascending: false }).limit(40) : { data: [] }
  ]);

  const events = [];
  (followersRes.data || []).forEach(f => events.push({ type: "follow", uid: f.follower_id, at: f.created_at }));
  (likesRes.data || []).forEach(l => events.push({ type: "like", uid: l.user_id, vid: l.video_id, at: l.created_at }));
  (cmtsRes.data || []).forEach(c => events.push({ type: "comment", uid: c.user_id, vid: c.video_id, text: c.text, at: c.created_at }));
  events.sort((a, b) => new Date(b.at) - new Date(a.at));

  const list = $("act-list");
  if (!events.length) {
    list.innerHTML = '<div class="empty-box">No activity yet. When someone follows you, likes, or comments on your videos, it will show up here!</div>';
    return;
  }

  const uids = [...new Set(events.map(e => e.uid))];
  const { data: profs } = await sb.from("profiles").select("id, username, display_name, avatar_url").in("id", uids);
  const pmap = Object.fromEntries((profs || []).map(p => [p.id, p]));

  list.innerHTML = "";
  events.forEach(ev => {
    const p = pmap[ev.uid] || { username: "user", display_name: "User" };
    const init = escapeHtml((p.display_name || p.username || "U")[0].toUpperCase());
    const av = p.avatar_url ? `style="background-image:url(${escapeHtml(p.avatar_url)})"` : "";
    const uLink = `<a href="/profile?u=${encodeURIComponent(p.username)}">@${escapeHtml(p.username)}</a>`;
    const vLink = ev.vid ? `<a href="/scroll#v=${encodeURIComponent(ev.vid)}">${escapeHtml(vidMap[ev.vid] || "your video")}</a>` : "";

    const card = document.createElement("div");
    card.className = "act-card";
    let msg = "";
    if (ev.type === "follow") msg = `${uLink} started following you`;
    else if (ev.type === "like") msg = `${uLink} liked ${vLink}`;
    else msg = `${uLink} commented on ${vLink}: "${escapeHtml(/^\[sticker:/.test(ev.text) ? "Sent a sticker" : ev.text)}"`;

    card.innerHTML = `<div class="act-av" ${av}>${p.avatar_url ? "" : init}</div>
      <div class="act-body">${msg}<small>${timeAgo(ev.at)}</small></div>`;

    if (ev.type === "follow") {
      const btn = document.createElement("button");
      const paint = () => {
        const isF = myFollowing.has(ev.uid);
        btn.className = "btn sm " + (isF ? "" : "primary");
        btn.textContent = isF ? "Friends" : "Follow back";
      };
      paint();
      btn.onclick = async () => {
        if (myFollowing.has(ev.uid)) {
          await sb.from("follows").delete().eq("follower_id", user.id).eq("following_id", ev.uid);
          myFollowing.delete(ev.uid);
        } else {
          await sb.from("follows").insert({ follower_id: user.id, following_id: ev.uid });
          myFollowing.add(ev.uid);
        }
        paint();
      };
      card.appendChild(btn);
    }
    list.appendChild(card);
  });
})();
</script>
</body>
</html>
