<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin · Web Tok</title><link rel="icon" href="/images/logo.png">
<style>
:root{--bg:#fff0ee;--surface:#ffe3e8;--card:#fbd5de;--primary:#7b3f8c;--on:#fff;--text:#3b1f2b;--muted:#85626f;--ok:#2e7d4f;--bad:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#22141b;--surface:#33202a;--card:#47303c;--primary:#e7b6f2;--on:#3a1745;--text:#f7dde5;--muted:#c3a1ae;--ok:#8fd5a6;--bad:#ffb4ab}}
*{box-sizing:border-box;margin:0}
body{font-family:"Google Sans",Roboto,system-ui,sans-serif;background:var(--bg);color:var(--text);padding:20px 14px 60px}
.wrap{max-width:900px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:26px}a{color:var(--primary)}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.btn{padding:10px 18px;border-radius:999px;border:0;font:inherit;font-weight:600;cursor:pointer;background:var(--surface);color:var(--text)}
.btn.p,.btn.on{background:var(--primary);color:var(--on)}.btn.bad{background:var(--bad);color:#fff}.btn:disabled{opacity:.4;cursor:default}
input[type=text],input[type=search]{width:100%;padding:13px 18px;border-radius:24px;border:2px solid transparent;background:var(--surface);color:var(--text);font:inherit;margin-bottom:12px}
input:focus{outline:0;border-color:var(--primary)}
.card{background:var(--card);border-radius:24px;padding:16px 18px;margin-bottom:10px}
.line{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.name{font-weight:700}.sub{color:var(--muted);font-size:14px;word-break:break-all}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--surface);font-size:12px;font-weight:700;margin-left:6px}
.badge.bad{background:var(--bad);color:#fff}.badge.role{background:var(--primary);color:var(--on)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.acts label{font-size:14px;display:flex;gap:4px;align-items:center}
#result{position:sticky;top:8px;z-index:5;background:var(--primary);color:var(--on);border-radius:24px;padding:16px 18px;margin-bottom:12px}
#result code{display:block;font-size:20px;margin:8px 0;word-break:break-all;background:#0003;border-radius:12px;padding:10px}
.hidden{display:none!important}.msg{color:var(--muted);padding:10px 4px}
</style></head><body>
<div class="wrap">
  <header><h1>Admin panel</h1><div><a href="/scroll">Back to Web Tok</a></div></header>
  <div id="result" class="hidden"></div>
  <div id="denied" class="hidden card">You don't have access to this page. <a href="/">Go home</a></div>
  <div id="app" class="hidden">
    <div class="tabs"><button class="btn on" data-tab="users">Users</button><button class="btn" data-tab="content">Content</button><button class="btn hidden" data-tab="log" id="logTab">Log</button></div>
    <section id="users"><input id="q" type="search" placeholder="Search by email, username or name"><div id="ulist"></div></section>
    <section id="content" class="hidden"></section>
    <section id="log" class="hidden"></section>
  </div>
</div>
<script src="/config.js"></script>
<script src="/js/wt-local.js"></script>
<script src="/js/admin.js"></script>
</body></html>
