<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin · Web Tok</title><link rel="icon" href="/images/logo.png">
<style>
:root{--bg:#f6f1fc;--surface:#ede5f7;--card:#e2d4f4;--primary:#6750a4;--on-primary:#fff;--on:#fff;--text:#1d192b;--muted:#625b71;--ok:#2e7d4f;--bad:#b3261e;--spring:cubic-bezier(.2,.9,.3,1.1)}
@media(prefers-color-scheme:dark){:root{--bg:#16121e;--surface:#221c2e;--card:#312842;--primary:#d0bcff;--on-primary:#381e72;--on:#381e72;--text:#ebe3f7;--muted:#b4abc5;--ok:#8fd5a6;--bad:#ffb4ab}}
*{box-sizing:border-box;margin:0}
body{font-family:"Google Sans",Roboto,system-ui,sans-serif;background:var(--bg);color:var(--text);padding:20px 14px 60px;min-height:100dvh}
#wp-layer{position:fixed;inset:0;z-index:-2;background-size:cover;background-position:center;opacity:0;pointer-events:none;transition:opacity .35s}
#wp-scrim{position:fixed;inset:0;z-index:-1;background:var(--bg);opacity:0;pointer-events:none;transition:opacity .35s}
body.has-wp #wp-layer{opacity:1}
body.has-wp #wp-scrim{opacity:.74}
.wrap{max-width:900px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:28px;letter-spacing:-.3px}a{color:var(--primary);font-weight:700;text-decoration:none}
.tabs{display:inline-flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;background:var(--surface);padding:6px;border-radius:999px}
.btn{padding:10px 18px;border-radius:999px;border:0;font:inherit;font-weight:700;cursor:pointer;background:var(--surface);color:var(--text);transition:transform .18s var(--spring),background .2s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.96)}
.btn.p,.btn.on{background:var(--primary);color:var(--on-primary)}.btn.bad{background:var(--bad);color:#fff}.btn:disabled{opacity:.4;cursor:default;transform:none}
input[type=text],input[type=search],textarea{width:100%;padding:14px 18px;border-radius:24px;border:2px solid transparent;background:var(--surface);color:var(--text);font:inherit;margin-bottom:12px}
input:focus,textarea:focus{outline:0;border-color:var(--primary)}
.card{background:var(--card);border-radius:28px;padding:18px 20px;margin-bottom:12px;box-shadow:0 4px 16px #0001}
.line{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.name{font-weight:700}.sub{color:var(--muted);font-size:14px;word-break:break-all}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--surface);font-size:12px;font-weight:700;margin-left:6px}
.badge.bad{background:var(--bad);color:#fff}.badge.role{background:var(--primary);color:var(--on-primary)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.acts label{font-size:14px;display:flex;gap:4px;align-items:center}
#result{position:sticky;top:8px;z-index:5;background:var(--primary);color:var(--on-primary);border-radius:28px;padding:18px 20px;margin-bottom:14px;box-shadow:0 8px 24px #0003}
#result code{display:block;font-size:20px;margin:8px 0;word-break:break-all;background:#0003;border-radius:14px;padding:10px}
.hidden{display:none!important}.msg{color:var(--muted);padding:10px 4px}
</style></head><body>
<div id="wp-layer"></div>
<div id="wp-scrim"></div>
<div class="wrap">
  <header><h1>Admin panel</h1><div><a class="btn" href="/scroll">← Back to Web Tok</a></div></header>
  <div id="result" class="hidden"></div>
  <div id="denied" class="hidden card">You don't have access to this page. <a href="/">Go home</a></div>
  <div id="app" class="hidden">
    <div class="card">
      <div class="name" style="margin-bottom:8px">Send Announcement to Everyone (via @notifications)</div>
      <textarea id="annText" rows="2" maxlength="1000" placeholder="Write an announcement that @notifications will message to every user…"></textarea>
      <div class="line">
        <span id="annHint" class="sub"></span>
        <button class="btn p" id="annSend">Send to everyone</button>
      </div>
    </div>
    <div class="tabs"><button class="btn on" data-tab="users">Users</button><button class="btn" data-tab="content">Content</button><button class="btn hidden" data-tab="log" id="logTab">Log</button></div>
    <section id="users"><input id="q" type="search" placeholder="Search by email, username or name"><div id="ulist"></div></section>
    <section id="content" class="hidden"></section>
    <section id="log" class="hidden"></section>
  </div>
</div>
<script src="/config.js"></script>
<script src="/js/wt-local.js"></script>
<script src="/js/theme.js"></script>
<script src="/js/admin.js"></script>
<script>
document.getElementById("annSend").onclick = async () => {
  const tx = document.getElementById("annText").value.trim();
  const hint = document.getElementById("annHint");
  const btn = document.getElementById("annSend");
  if (!tx) { hint.textContent = "Write a message first."; return; }
  btn.disabled = true; hint.textContent = "Sending…";
  try {
    const { data } = await supabase.createClient(WT_CONFIG.SUPABASE_URL, WT_CONFIG.SUPABASE_ANON_KEY).auth.getSession();
    const r = await fetch("/api/admin/announce", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + data.session.access_token },
      body: JSON.stringify({ message: tx })
    });
    const j = await r.json();
    if (!r.ok || j.error) throw new Error(j.error?.message || "Failed");
    document.getElementById("annText").value = "";
    hint.textContent = `Sent to ${j.data.sentCount} user(s)!`;
  } catch (e) { hint.textContent = e.message; }
  finally { btn.disabled = false; }
};
</script>
</body></html>
