<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Web Tok · Mini Games</title>
<link rel="icon" href="/images/logo.png">
<link rel="stylesheet" href="/css/base.css">
<style>
body{overflow:auto;padding:24px 16px 90px}
.wrap{max-width:960px;margin:0 auto;padding-left:var(--sbw,0px);display:flex;flex-direction:column;gap:20px}
@media(max-width:800px){.wrap{padding-left:0}}
.head-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.head-row h1{font-size:28px;font-weight:700;letter-spacing:-.3px;display:flex;align-items:center;gap:10px}
.sec-h{font-size:16px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}
.g-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.g-card{background:var(--card);border-radius:var(--r-xl);padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 4px 18px #0001;transition:transform .2s var(--spring)}
.g-card:hover{transform:translateY(-2px)}
.g-ic{width:50px;height:50px;clip-path:var(--m3-cookie-4);background:var(--primary);color:var(--on-primary);display:grid;place-items:center;flex:none}
.g-top{display:flex;align-items:center;gap:12px}
.g-meta b{display:block;font-size:17px}
.g-meta small{color:var(--muted);font-size:12px}
.g-desc{font-size:13px;color:var(--muted);line-height:1.45;flex:1}
.g-foot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.g-badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface);color:var(--primary)}
#playDlg{width:min(96vw,1080px);max-width:96vw;max-height:96dvh;padding:20px;border-radius:var(--r-xl)}
#playDlg[open]{display:flex;flex-direction:column}
.play-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex:none}
.play-stage{background:#120e1a;border-radius:24px;overflow:hidden;display:grid;place-items:center;position:relative;flex:1;min-height:0;width:100%}
#gameCanvas{display:block;width:min(100%,84dvh,1000px);max-height:100%;aspect-ratio:1;height:auto;touch-action:none}
#playDlg.has-dpad #gameCanvas{width:min(100%,68dvh,1000px)}
#gameFrame{width:100%;height:min(84dvh,1000px);border:0;background:#120e1a;display:block}
.dpad{display:grid;grid-template-columns:repeat(3,52px);gap:6px;justify-content:center;margin-top:12px;flex:none}
.dpad button{height:44px;border-radius:14px;background:var(--surface);display:grid;place-items:center;font-weight:700}
.dpad button:active{background:var(--primary);color:var(--on-primary)}
</style>
</head>
<body data-page="games">
<div id="wp-layer"></div>
<div id="wp-scrim"></div>
<main class="wrap">
  <div class="head-row">
    <h1><span class="ms fill" style="font-size:30px;color:var(--primary)">sports_esports</span>Mini Games</h1>
    <a class="btn primary" href="/developer"><span class="ms" style="font-size:18px">code</span>Build a Game (/developer)</a>
  </div>

  <div class="sec-h">Built-in Arcade</div>
  <div class="g-grid" id="builtinGrid"></div>

  <div class="sec-h">Community Games</div>
  <div class="g-grid" id="commGrid">
    <div class="m3-loader"><div class="m3-wave"><svg viewBox="0 0 160 14" fill="none"><path d="M0 7 Q10 1 20 7 T40 7 T60 7 T80 7 T100 7 T120 7 T140 7 T160 7" stroke="var(--primary)" stroke-width="3.2" stroke-linecap="round"/></svg></div><span>Loading community games…</span></div>
  </div>
</main>

<dialog id="playDlg">
  <div class="play-head">
    <div><b id="playTitle" style="font-size:18px">Game</b><div id="playScore" style="font-size:13px;color:var(--primary);font-weight:700"></div></div>
    <div style="display:flex;gap:8px">
      <button type="button" class="btn sm" id="playRestart"><span class="ms" style="font-size:16px">refresh</span>Restart</button>
      <button type="button" class="btn icon" id="playClose" aria-label="Close"><span class="ms">close</span></button>
    </div>
  </div>
  <div class="play-stage" id="playStage"></div>
  <div class="dpad hidden" id="dpad">
    <div></div><button type="button" data-dir="up"><span class="ms">arrow_upward</span></button><div></div>
    <button type="button" data-dir="left"><span class="ms">arrow_back</span></button>
    <button type="button" data-dir="down"><span class="ms">arrow_downward</span></button>
    <button type="button" data-dir="right"><span class="ms">arrow_forward</span></button>
  </div>
</dialog>

<script src="/config.js"></script>
<script src="/js/wt-local.js"></script>
<script src="/js/sidebar.js"></script>
<script src="/js/core.js"></script>
<script src="/js/theme.js"></script>
<script src="/js/games-more.js"></script>
<script src="/js/games.js"></script>
</body>
</html>
