<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web Tok · Messages</title><link rel="icon" href="/images/logo.png">
<style>
:root{
  --bg:#f6f1fc;--surface:#ede5f7;--card:#e2d4f4;--primary:#6750a4;--on-primary:#fff;
  --text:#1d192b;--muted:#625b71;--accent:#ffd8e4;--on-accent:#31111d;
  --spring:cubic-bezier(.2,.9,.3,1.1)
}
@media(prefers-color-scheme:dark){:root{
  --bg:#16121e;--surface:#221c2e;--card:#312842;--primary:#d0bcff;--on-primary:#381e72;
  --text:#ebe3f7;--muted:#b4abc5;--accent:#633b48;--on-accent:#ffd8e4
}}
*{box-sizing:border-box;margin:0}
body{font-family:"Google Sans",Roboto,system-ui,sans-serif;background:var(--bg);color:var(--text);height:100dvh;overflow:hidden}
#wp-layer{position:fixed;inset:0;z-index:-2;background-size:cover;background-position:center;opacity:0;pointer-events:none;transition:opacity .35s}
#wp-scrim{position:fixed;inset:0;z-index:-1;background:var(--bg);opacity:0;pointer-events:none;transition:opacity .35s}
body.has-wp #wp-layer{opacity:1}
body.has-wp #wp-scrim{opacity:.74}
#app{position:fixed;left:var(--sbw);right:0;top:0;bottom:var(--sbh);display:flex}

/* Sidebar list */
#list{width:320px;border-right:1px solid var(--surface);display:flex;flex-direction:column;background:transparent}
.list-top{padding:16px 14px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.list-top h2{font-size:22px;font-weight:700;letter-spacing:-.3px}
.m3-fab{border:0;border-radius:18px;background:var(--primary);color:var(--on-primary);padding:10px 16px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:transform .2s var(--spring),border-radius .2s var(--spring);box-shadow:0 3px 12px #0002}
.m3-fab:hover{transform:translateY(-1px)}
.m3-fab:active{transform:scale(.95);border-radius:26px}

/* M3 Expressive Segmented Pill Tabs */
.seg-tabs{display:flex;gap:4px;margin:0 14px 10px;padding:4px;background:var(--surface);border-radius:999px}
.seg-tab{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-size:12px;font-weight:700;padding:8px 6px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;transition:background .2s,color .2s}
.seg-tab.on{background:var(--primary);color:var(--on-primary)}
.seg-badge{background:var(--accent);color:var(--on-accent);font-size:10px;font-weight:800;padding:1px 6px;border-radius:999px}
.seg-tab.on .seg-badge{background:var(--on-primary);color:var(--primary)}

#fl{flex:1;overflow-y:auto;padding:4px 10px 16px;display:flex;flex-direction:column;gap:4px}
.sec-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);padding:10px 12px 4px}
.fr{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:24px;cursor:pointer;transition:background .18s,transform .18s var(--spring)}
.fr:hover,.fr.on{background:var(--surface)}
.fr:active{transform:scale(.98)}
.fr-meta{min-width:0;flex:1}
.fr-name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fr-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* M3 Expressive Organic Avatars */
.av{width:44px;height:44px;border-radius:38% 62% 55% 45%/45% 38% 62% 55%;background:var(--card) center/cover;display:grid;place-items:center;font-weight:700;color:var(--primary);flex:none;transition:border-radius .25s var(--spring)}
.fr:hover .av{border-radius:50% 42% 48% 52%}
.av.grp{background:var(--accent);color:var(--on-accent);border-radius:16px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--primary);margin-left:auto;display:none;flex:none}
.fr.unread .dot{display:block}
.u-badge{margin-left:auto;background:var(--primary);color:var(--on-primary);font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;flex:none}

/* Invite Card */
.inv-card{background:var(--surface);border-radius:24px;padding:14px;margin:4px 2px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--card)}
.inv-top{display:flex;align-items:center;gap:10px}
.inv-acts{display:flex;gap:8px}
.pill-btn{flex:1;border:0;border-radius:999px;padding:9px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:transform .15s var(--spring)}
.pill-btn:active{transform:scale(.96)}
.pill-btn.p{background:var(--primary);color:var(--on-primary)}
.pill-btn.t{background:var(--card);color:var(--text)}

/* Chat Area */
#chat{flex:1;display:flex;flex-direction:column;min-width:0}
#head{padding:14px 20px;font-weight:700;border-bottom:1px solid var(--surface);display:flex;align-items:center;gap:12px;background:transparent}
.head-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.head-chip{border:0;border-radius:999px;background:var(--surface);color:var(--text);padding:7px 14px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.head-chip:hover{background:var(--card)}
#msgs{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:8px}
.m-wrap{display:flex;flex-direction:column;max-width:74%;align-self:flex-start;gap:3px}
.m-wrap.me{align-self:flex-end;align-items:flex-end}
.m-sender{font-size:11px;font-weight:700;color:var(--muted);padding:0 10px}
.m{padding:11px 16px;border-radius:22px 22px 22px 6px;background:var(--surface);word-break:break-word;line-height:1.4}
.m-wrap.me .m{background:var(--primary);color:var(--on-primary);border-radius:22px 22px 6px 22px}
#form{display:flex;gap:10px;padding:12px 16px;background:transparent}
#form input{flex:1;padding:14px 20px;border-radius:999px;border:2px solid transparent;background:var(--surface);color:var(--text);font:inherit;outline:0;transition:border-color .15s}
#form input:focus{border-color:var(--primary)}
#form button{border:0;border-radius:18px;background:var(--primary);color:var(--on-primary);width:50px;height:50px;cursor:pointer;display:grid;place-items:center;transition:border-radius .2s var(--spring),transform .15s}
#form button:active{border-radius:999px;transform:scale(.95)}
.empty{margin:auto;color:var(--muted);text-align:center;padding:30px;max-width:34ch;line-height:1.5}
.hidden{display:none!important}
#stkPanel{max-height:200px;overflow-y:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px 16px;background:var(--surface);border-radius:24px 24px 0 0;margin:0 16px}
#stkPanel button{background:none!important;border:0;cursor:pointer;border-radius:16px;padding:4px;width:auto!important;height:auto!important}
#stkPanel button:hover{background:var(--card)!important}
#stkPanel img,#stkPanel .stk-box{width:100%;aspect-ratio:1;object-fit:contain;display:block}
#form #stkBtn{background:var(--surface);color:var(--text)}
.m.stk{background:none!important;padding:0}.m.stk img,.m.stk .stk-box{width:150px;height:150px;object-fit:contain;display:block}
#back{display:none;background:none;border:0;color:var(--text);cursor:pointer}

/* M3 Expressive Wavy Loader */
.m3-loader{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;margin:auto;padding:24px;color:var(--muted);font-size:13px;font-weight:600}
.m3-wave{width:160px;height:14px;overflow:hidden}
.m3-wave svg{width:200%;height:100%;animation:waveMove 1.1s linear infinite}
@keyframes waveMove{to{transform:translateX(-50%)}}

/* Modals */
dialog{border:0;border-radius:32px;padding:24px;width:min(94vw,440px);background:var(--bg);color:var(--text);margin:auto;box-shadow:0 16px 48px #0004}
dialog::backdrop{background:#0006;backdrop-filter:blur(4px)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.dlg-head h3{font-size:20px;font-weight:700}
.dlg-in{width:100%;padding:14px 16px;border-radius:20px;border:2px solid transparent;background:var(--surface);color:var(--text);font:inherit;outline:0;margin-bottom:12px}
.dlg-in:focus{border-color:var(--primary)}
.pick-list{max-height:240px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.pick-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:18px;background:var(--surface);cursor:pointer}
.pick-row input{accent-color:var(--primary);width:18px;height:18px}
.dlg-foot{display:flex;gap:8px;justify-content:flex-end}

@media(max-width:800px){#list{width:100%}#chat{display:none}body.chatting #list{display:none}body.chatting #chat{display:flex}#back{display:block}}
</style></head>
<body data-page="messages">
<div id="wp-layer"></div>
<div id="wp-scrim"></div>
<div id="app">
 <aside id="list">
  <div class="list-top">
    <h2>Messages</h2>
    <button class="m3-fab" id="btnNewGroup"><span class="ms" style="font-size:18px">group_add</span>Group</button>
  </div>
  <div class="seg-tabs">
    <button class="seg-tab on" data-tab="all">All</button>
    <button class="seg-tab" data-tab="friends">Friends</button>
    <button class="seg-tab" data-tab="groups">Groups</button>
    <button class="seg-tab" data-tab="invites">Invites <span class="seg-badge hidden" id="invBadge">0</span></button>
  </div>
  <div id="fl">
    <div class="m3-loader"><div class="m3-wave"><svg viewBox="0 0 160 14" fill="none"><path d="M0 7 Q10 1 20 7 T40 7 T60 7 T80 7 T100 7 T120 7 T140 7 T160 7" stroke="var(--primary)" stroke-width="3.2" stroke-linecap="round"/></svg></div><span>Loading chats…</span></div>
  </div>
 </aside>
 <section id="chat"><div class="empty" id="ph">Pick a friend or group chat to start messaging. Create a group to invite friends!</div></section>
</div>

<!-- New Group Chat Modal -->
<dialog id="newGroupDlg">
  <div class="dlg-head"><h3>New group chat</h3><button class="head-chip" onclick="document.getElementById('newGroupDlg').close()">✕</button></div>
  <input class="dlg-in" id="ngName" maxlength="40" placeholder="Group name (e.g. Comedy Squad)">
  <div style="font-size:12px;color:var(--muted);margin:0 4px 8px">Select friends to send an invite:</div>
  <div class="pick-list" id="ngFriends"></div>
  <div id="ngHint" style="font-size:12px;color:#b3261e;min-height:16px;margin-bottom:8px"></div>
  <div class="dlg-foot">
    <button class="pill-btn t" style="flex:0" onclick="document.getElementById('newGroupDlg').close()">Cancel</button>
    <button class="pill-btn p" style="flex:0;white-space:nowrap" id="ngSubmit">Send invites</button>
  </div>
</dialog>

<!-- Invite More Friends to Existing Group Modal -->
<dialog id="invMoreDlg">
  <div class="dlg-head"><h3>Invite friends</h3><button class="head-chip" onclick="document.getElementById('invMoreDlg').close()">✕</button></div>
  <div class="pick-list" id="imFriends"></div>
  <div id="imHint" style="font-size:12px;color:#b3261e;min-height:16px;margin-bottom:8px"></div>
  <div class="dlg-foot">
    <button class="pill-btn t" style="flex:0" onclick="document.getElementById('invMoreDlg').close()">Cancel</button>
    <button class="pill-btn p" style="flex:0;white-space:nowrap" id="imSubmit">Send invites</button>
  </div>
</dialog>

<script src="/config.js"></script>
<script src="/js/wt-local.js"></script>
<script src="/js/sidebar.js"></script>
<script src="/js/theme.js"></script>
<script>
const $=id=>document.getElementById(id), sb=supabase.createClient(WT_CONFIG.SUPABASE_URL,WT_CONFIG.SUPABASE_ANON_KEY);
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let me=null, token=null, cur=null, curType=null, friends=[], groups=[], invites=[], unreadBySender={}, activeTab="all", groupPoll=null, lastGroupMsgId=0;
const avStyle=p=>p&&p.avatar_url?`style="background-image:url(${esc(p.avatar_url)})"`:"";
let lottieP=null;
function ensureLottie(){if(window.lottie)return Promise.resolve(window.lottie);return lottieP||(lottieP=new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/lottie-web@5.12.2/build/player/lottie.min.js";s.onload=()=>ok(window.lottie);s.onerror=no;document.head.appendChild(s)}))}
async function lottieIn(el,path){try{(await ensureLottie()).loadAnimation({container:el,renderer:"svg",loop:true,autoplay:true,path})}catch(e){console.warn(e)}}
const STK=/^\[sticker:([^\]\/\\]+\.(?:png|gif|webp|jpe?g|svg|json))\]$/i;
function stickerEl(file){const url="/stickers/"+encodeURIComponent(file);if(/\.json$/i.test(file)){const b=document.createElement("div");b.className="stk-box";lottieIn(b,url);return b}const i=document.createElement("img");i.src=url;i.alt="sticker";i.loading="lazy";return i}
function api(url, opts={}){return fetch(url,{...opts,headers:{"Content-Type":"application/json",Authorization:"Bearer "+token,...(opts.headers||{})}}).then(async r=>{const j=await r.json().catch(()=>({}));if(!r.ok||j.error)throw new Error(j.error?.message||"Request failed");return j.data})}

function bubble(m, showSender=false){
  const wrap=document.createElement("div");
  wrap.className="m-wrap"+(m.sender_id===me?" me":"");
  if(showSender && m.sender_id!==me){
    const sn=document.createElement("div");
    sn.className="m-sender";
    sn.textContent=m.display_name||("@"+(m.username||"user"));
    wrap.appendChild(sn);
  }
  const d=document.createElement("div");d.className="m";
  const s=STK.exec((m.body||"").trim());
  if(s){d.classList.add("stk");d.appendChild(stickerEl(s[1]))}else d.textContent=m.body;
  wrap.appendChild(d);
  $("msgs").appendChild(wrap);
  $("msgs").scrollTop=1e9;
}

function stopGroupPoll(){if(groupPoll){clearInterval(groupPoll);groupPoll=null;}}
let stickerList=null;
function wireStickerPicker(sendFn){
  $("stkBtn").onclick=async()=>{
    const pn=$("stkPanel");pn.classList.toggle("hidden");
    if(pn.classList.contains("hidden")||pn.dataset.ready)return;pn.dataset.ready="1";
    try{stickerList=stickerList||await (await fetch("/api/stickers")).json()}catch{stickerList=[]}
    pn.innerHTML=stickerList.length?"":'<div style="grid-column:1/-1;color:var(--muted);padding:8px">No stickers yet.</div>';
    stickerList.forEach(file=>{const b=document.createElement("button");b.type="button";b.appendChild(stickerEl(file));b.onclick=()=>{pn.classList.add("hidden");sendFn("[sticker:"+file+"]")};pn.appendChild(b)})
  };
}

async function openChat(f){
  stopGroupPoll();
  cur=f; curType="dm"; document.body.classList.add("chatting");
  delete unreadBySender[f.id];
  renderSidebarList();
  $("chat").innerHTML=`<div id="head"><button id="back" aria-label="Back"><span class="ms">arrow_back</span></button><div class="av" ${avStyle(f)}>${f.avatar_url?"":esc((f.display_name||f.username||"?")[0].toUpperCase())}</div><div><div>${esc(f.display_name||f.username)}</div><div style="font-size:12px;color:var(--muted);font-weight:500">@${esc(f.username)}</div></div></div>
  <div id="msgs"><div class="m3-loader"><div class="m3-wave"><svg viewBox="0 0 160 14" fill="none"><path d="M0 7 Q10 1 20 7 T40 7 T60 7 T80 7 T100 7 T120 7 T140 7 T160 7" stroke="var(--primary)" stroke-width="3.2" stroke-linecap="round"/></svg></div></div></div>
  <div id="stkPanel" class="hidden"></div>
  <form id="form"><input id="txt" maxlength="1000" placeholder="Message…" autocomplete="off"><button type="button" id="stkBtn" aria-label="Stickers"><span class="ms">emoji_emotions</span></button><button aria-label="Send"><span class="ms">send</span></button></form>`;
  $("back").onclick=()=>{document.body.classList.remove("chatting");cur=null;curType=null};
  const {data}=await sb.from("messages").select("*").or(`and(sender_id.eq.${me},recipient_id.eq.${f.id}),and(sender_id.eq.${f.id},recipient_id.eq.${me})`).order("created_at").limit(300);
  $("msgs").innerHTML="";
  (data||[]).forEach(m=>bubble(m,false));
  if(window.wtMarkRead)wtMarkRead(f.id);
  async function send(body){const {data:m,error}=await sb.from("messages").insert({sender_id:me,recipient_id:f.id,body}).select().single();
    if(error){alert("Couldn't send: "+error.message);return false}bubble(m,false);return true}
  $("form").onsubmit=async e=>{e.preventDefault();const body=$("txt").value.trim();if(!body)return;$("txt").value="";if(!(await send(body)))$("txt").value=body};
  wireStickerPicker(send);
  $("txt").focus();
}

async function openGroupChat(g){
  stopGroupPoll();
  cur=g; curType="group"; lastGroupMsgId=0; g.unread_count=0;
  document.body.classList.add("chatting");
  renderSidebarList();
  $("chat").innerHTML=`<div id="head"><button id="back" aria-label="Back"><span class="ms">arrow_back</span></button><div class="av grp"><span class="ms">groups</span></div><div style="min-width:0"><div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(g.name)}</div><div style="font-size:12px;color:var(--muted);font-weight:500">${g.member_count||1} member${(g.member_count||1)===1?"":"s"}</div></div><div class="head-actions"><button class="head-chip" id="btnInvMore"><span class="ms" style="font-size:16px">person_add</span>Invite</button><button class="head-chip" id="btnLeaveGrp">Leave</button></div></div>
  <div id="msgs"><div class="m3-loader"><div class="m3-wave"><svg viewBox="0 0 160 14" fill="none"><path d="M0 7 Q10 1 20 7 T40 7 T60 7 T80 7 T100 7 T120 7 T140 7 T160 7" stroke="var(--primary)" stroke-width="3.2" stroke-linecap="round"/></svg></div></div></div>
  <div id="stkPanel" class="hidden"></div>
  <form id="form"><input id="txt" maxlength="1000" placeholder="Message ${esc(g.name)}…" autocomplete="off"><button type="button" id="stkBtn" aria-label="Stickers"><span class="ms">emoji_emotions</span></button><button aria-label="Send"><span class="ms">send</span></button></form>`;
  $("back").onclick=()=>{stopGroupPoll();document.body.classList.remove("chatting");cur=null;curType=null};
  $("btnLeaveGrp").onclick=async()=>{
    if(!confirm(`Leave "${g.name}"?`))return;
    await api(`/api/groups/${encodeURIComponent(g.id)}/leave`,{method:"POST",body:"{}"});
    stopGroupPoll(); cur=null; curType=null; document.body.classList.remove("chatting");
    $("chat").innerHTML='<div class="empty">Left group chat.</div>';
    await loadGroupsAndInvites();
  };
  $("btnInvMore").onclick=()=>openInviteMore(g);

  const msgs=await api(`/api/groups/${encodeURIComponent(g.id)}/messages`);
  $("msgs").innerHTML="";
  if(!msgs.length) $("msgs").innerHTML='<div class="empty">No messages yet. Say hi!</div>';
  msgs.forEach(m=>{bubble(m,true);lastGroupMsgId=Math.max(lastGroupMsgId,m.id)});

  async function send(body){
    try{
      const m=await api(`/api/groups/${encodeURIComponent(g.id)}/messages`,{method:"POST",body:JSON.stringify({body})});
      const em=$("msgs").querySelector(".empty"); if(em) em.remove();
      if(m.id>lastGroupMsgId){bubble(m,true);lastGroupMsgId=m.id;}
      return true;
    }catch(err){alert("Couldn't send: "+err.message);return false}
  }
  $("form").onsubmit=async e=>{e.preventDefault();const body=$("txt").value.trim();if(!body)return;$("txt").value="";if(!(await send(body)))$("txt").value=body};
  wireStickerPicker(send);
  $("txt").focus();

  groupPoll=setInterval(async()=>{
    if(curType!=="group"||!cur||cur.id!==g.id)return;
    try{
      const newer=await api(`/api/groups/${encodeURIComponent(g.id)}/messages?after=${lastGroupMsgId}`);
      if(newer.length){
        const em=$("msgs").querySelector(".empty"); if(em) em.remove();
        newer.forEach(m=>{if(m.id>lastGroupMsgId){bubble(m,true);lastGroupMsgId=m.id}});
      }
    }catch{}
  },3000);
}

function renderSidebarList(){
  const fl=$("fl"); fl.innerHTML="";
  const badge=$("invBadge");
  badge.textContent=invites.length;
  badge.classList.toggle("hidden",!invites.length);

  const showInvites=activeTab==="invites"||(activeTab==="all"&&invites.length);
  const showGroups=activeTab==="all"||activeTab==="groups";
  const showFriends=activeTab==="all"||activeTab==="friends";

  if(showInvites && invites.length){
    const lbl=document.createElement("div"); lbl.className="sec-lbl"; lbl.textContent="Group Invites"; fl.appendChild(lbl);
    invites.forEach(inv=>{
      const card=document.createElement("div"); card.className="inv-card";
      card.innerHTML=`<div class="inv-top"><div class="av grp"><span class="ms">group_add</span></div><div class="fr-meta"><div class="fr-name">${esc(inv.name)}</div><div class="fr-sub">Invited by @${esc(inv.inviter_username||"friend")} · ${inv.member_count||1} in chat</div></div></div>
      <div class="inv-acts"><button class="pill-btn p">Accept</button><button class="pill-btn t">Decline</button></div>`;
      const [accBtn,decBtn]=card.querySelectorAll("button");
      accBtn.onclick=async()=>{
        accBtn.disabled=true;
        await api(`/api/groups/${encodeURIComponent(inv.group_id)}/respond`,{method:"POST",body:JSON.stringify({accept:true})});
        await loadGroupsAndInvites();
        const joined=groups.find(g=>g.id===inv.group_id);
        if(joined) openGroupChat(joined);
      };
      decBtn.onclick=async()=>{
        decBtn.disabled=true;
        await api(`/api/groups/${encodeURIComponent(inv.group_id)}/respond`,{method:"POST",body:JSON.stringify({accept:false})});
        await loadGroupsAndInvites();
      };
      fl.appendChild(card);
    });
  } else if(activeTab==="invites" && !invites.length){
    fl.innerHTML='<div class="empty">No pending group invites right now.</div>';
    return;
  }

  if(showGroups){
    if(groups.length){
      const lbl=document.createElement("div"); lbl.className="sec-lbl"; lbl.textContent="Group Chats"; fl.appendChild(lbl);
      groups.forEach(g=>{
        const e=document.createElement("div");
        e.className="fr"+(curType==="group"&&cur?.id===g.id?" on":"");
        e.innerHTML=`<div class="av grp"><span class="ms">groups</span></div><div class="fr-meta"><div class="fr-name">${esc(g.name)}</div><div class="fr-sub">${g.member_count||1} member${(g.member_count||1)===1?"":"s"}</div></div>${g.unread_count?`<span class="u-badge">${g.unread_count}</span>`:""}`;
        e.onclick=()=>openGroupChat(g);
        fl.appendChild(e);
      });
    } else if(activeTab==="groups"){
      fl.innerHTML='<div class="empty">No group chats yet. Tap <b>+ Group</b> above to start one with friends!</div>';
      return;
    }
  }

  if(showFriends){
    if(friends.length){
      const lbl=document.createElement("div"); lbl.className="sec-lbl"; lbl.textContent="Friends"; fl.appendChild(lbl);
      friends.forEach(f=>{
        const e=document.createElement("div");
        e.className="fr"+(curType==="dm"&&cur?.id===f.id?" on":"")+(unreadBySender[f.id]?" unread":"");
        e.dataset.id=f.id;
        e.innerHTML=`<div class="av" ${avStyle(f)}>${f.avatar_url?"":esc((f.display_name||f.username||"?")[0].toUpperCase())}</div><div class="fr-meta"><div class="fr-name">${esc(f.display_name||f.username)}</div><div class="fr-sub">@${esc(f.username)}</div></div><i class="dot"></i>`;
        e.onclick=()=>openChat(f);
        fl.appendChild(e);
      });
    } else if(activeTab==="friends" || (activeTab==="all" && !groups.length && !invites.length)){
      fl.innerHTML='<div class="empty">No friends yet. Follow someone and have them follow you back.</div>';
    }
  }
}

document.querySelectorAll(".seg-tab").forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll(".seg-tab").forEach(b=>b.classList.toggle("on",b===btn));
    activeTab=btn.dataset.tab;
    renderSidebarList();
  };
});

$("btnNewGroup").onclick=()=>{
  $("ngName").value=""; $("ngHint").textContent="";
  const box=$("ngFriends"); box.innerHTML="";
  if(!friends.length){box.innerHTML='<div style="color:var(--muted);font-size:13px;padding:8px">Follow someone and have them follow you back first.</div>';}
  friends.forEach(f=>{
    const row=document.createElement("label"); row.className="pick-row";
    row.innerHTML=`<input type="checkbox" value="${esc(f.id)}"><div class="av" style="width:34px;height:34px" ${avStyle(f)}>${f.avatar_url?"":esc((f.display_name||f.username||"?")[0].toUpperCase())}</div><div><b>${esc(f.display_name||f.username)}</b> <span style="color:var(--muted);font-size:12px">@${esc(f.username)}</span></div>`;
    box.appendChild(row);
  });
  $("newGroupDlg").showModal();
};

$("ngSubmit").onclick=async()=>{
  const name=$("ngName").value.trim();
  const memberIds=[...$("ngFriends").querySelectorAll("input:checked")].map(i=>i.value);
  if(!name){$("ngHint").textContent="Enter a group name.";return}
  if(!memberIds.length){$("ngHint").textContent="Pick at least one friend.";return}
  $("ngSubmit").disabled=true; $("ngHint").textContent="";
  try{
    const created=await api("/api/groups",{method:"POST",body:JSON.stringify({name,memberIds})});
    $("newGroupDlg").close();
    await loadGroupsAndInvites();
    const g=groups.find(x=>x.id===created.id);
    if(g) openGroupChat(g);
  }catch(err){$("ngHint").textContent=err.message;}
  finally{$("ngSubmit").disabled=false;}
};

function openInviteMore(g){
  $("imHint").textContent="";
  const inGrp=new Set((g.members||[]).map(m=>m.id));
  const avail=friends.filter(f=>!inGrp.has(f.id));
  const box=$("imFriends"); box.innerHTML="";
  if(!avail.length) box.innerHTML='<div style="color:var(--muted);font-size:13px;padding:8px">All your friends are already in this group.</div>';
  avail.forEach(f=>{
    const row=document.createElement("label"); row.className="pick-row";
    row.innerHTML=`<input type="checkbox" value="${esc(f.id)}"><div class="av" style="width:34px;height:34px" ${avStyle(f)}>${f.avatar_url?"":esc((f.display_name||f.username||"?")[0].toUpperCase())}</div><div><b>${esc(f.display_name||f.username)}</b> <span style="color:var(--muted);font-size:12px">@${esc(f.username)}</span></div>`;
    box.appendChild(row);
  });
  $("imSubmit").onclick=async()=>{
    const memberIds=[...box.querySelectorAll("input:checked")].map(i=>i.value);
    if(!memberIds.length){$("imHint").textContent="Pick at least one friend.";return}
    $("imSubmit").disabled=true;
    try{
      await api(`/api/groups/${encodeURIComponent(g.id)}/invite`,{method:"POST",body:JSON.stringify({memberIds})});
      $("invMoreDlg").close();
    }catch(err){$("imHint").textContent=err.message;}
    finally{$("imSubmit").disabled=false;}
  };
  $("invMoreDlg").showModal();
}

async function loadGroupsAndInvites(){
  try{
    const res=await api("/api/groups");
    groups=res.groups||[];
    invites=res.invites||[];
  }catch{groups=[];invites=[];}
  renderSidebarList();
}

(async()=>{
  const {data}=await sb.auth.getSession(); if(!data.session){location.href="/login";return}
  me=data.session.user.id; token=data.session.access_token;
  const [a,b]=await Promise.all([sb.from("follows").select("following_id").eq("follower_id",me),sb.from("follows").select("follower_id").eq("following_id",me)]);
  const mine=new Set((a.data||[]).map(r=>r.following_id)), ids=(b.data||[]).map(r=>r.follower_id).filter(id=>mine.has(id));
  if(ids.length){
    const {data:ps}=await sb.from("profiles").select("id,username,display_name,avatar_url").in("id",ids);
    friends=ps||[];
  }
  try{
    const r=await fetch("/api/messages/unread",{headers:{Authorization:"Bearer "+token}});
    unreadBySender=(await r.json()).data?.bySender||{};
  }catch{}
  await loadGroupsAndInvites();
  setInterval(loadGroupsAndInvites,12000);
  addEventListener("hashchange",()=>{const f=friends.find(x=>x.id===location.hash.slice(1));if(f)openChat(f)});
  const want=location.hash.slice(1),wf=friends.find(x=>x.id===want); if(wf) openChat(wf);
  sb.channel("dm-"+me).on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:`recipient_id=eq.${me}`},p=>{
    const m=p.new; if(curType==="dm"&&cur&&cur.id===m.sender_id){bubble(m,false);if(window.wtMarkRead)wtMarkRead(m.sender_id)} else{unreadBySender[m.sender_id]=1;renderSidebarList()}}).subscribe();
})();
</script></body></html>
