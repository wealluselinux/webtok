<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web Tok · Messages</title><link rel="icon" href="/images/logo.png">
<style>
:root{
  --bg:#f6f1fc;--surface:#ede5f7;--card:#e2d4f4;--primary:#6750a4;--on-primary:#fff;
  --text:#1d192b;--muted:#625b71;--accent:#ffd8e4;--on-accent:#31111d;--bad:#b3261e;
  --spring:cubic-bezier(.2,.9,.3,1.1);
  --m3-cookie-7:polygon(94.8% 50.0%,97.1% 53.5%,98.4% 57.3%,98.4% 61.0%,96.8% 64.4%,93.9% 67.2%,90.4% 69.4%,86.7% 71.2%,83.6% 72.9%,81.3% 74.9%,79.8% 77.6%,78.8% 81.1%,77.9% 85.0%,76.6% 89.0%,74.5% 92.4%,71.5% 94.7%,67.9% 95.6%,63.9% 95.1%,60.0% 93.7%,56.3% 91.9%,53.0% 90.5%,50.0% 90.0%,47.0% 90.5%,43.7% 91.9%,40.0% 93.7%,36.1% 95.1%,32.1% 95.6%,28.5% 94.7%,25.5% 92.4%,23.4% 89.0%,22.1% 85.0%,21.2% 81.1%,20.2% 77.6%,18.7% 74.9%,16.4% 72.9%,13.3% 71.2%,9.6% 69.4%,6.1% 67.2%,3.2% 64.4%,1.6% 61.0%,1.6% 57.3%,2.9% 53.5%,5.2% 50.0%,7.7% 46.8%,9.8% 43.9%,11.0% 41.1%,11.2% 38.0%,10.5% 34.5%,9.6% 30.6%,9.1% 26.4%,9.5% 22.4%,11.2% 19.1%,14.1% 16.7%,17.9% 15.4%,22.1% 15.0%,26.1% 15.0%,29.7% 14.8%,32.6% 14.0%,35.2% 12.2%,37.5% 9.5%,40.0% 6.3%,43.0% 3.3%,46.3% 1.2%,50.0% 0.4%,53.7% 1.2%,57.0% 3.3%,60.0% 6.3%,62.5% 9.5%,64.8% 12.2%,67.4% 14.0%,70.3% 14.8%,73.9% 15.0%,77.9% 15.0%,82.1% 15.4%,85.9% 16.7%,88.8% 19.1%,90.5% 22.4%,90.9% 26.4%,90.4% 30.6%,89.5% 34.5%,88.8% 38.0%,89.0% 41.1%,90.2% 43.9%,92.3% 46.8%);
  --m3-cookie-4:polygon(99.5% 50.0%,98.8% 54.8%,96.8% 59.3%,93.8% 63.3%,90.2% 66.6%,86.3% 69.4%,82.6% 71.8%,79.3% 74.1%,76.5% 76.5%,74.1% 79.3%,71.8% 82.6%,69.4% 86.3%,66.6% 90.2%,63.3% 93.8%,59.3% 96.8%,54.8% 98.8%,50.0% 99.5%,45.2% 98.8%,40.7% 96.8%,36.7% 93.8%,33.4% 90.2%,30.6% 86.3%,28.2% 82.6%,25.9% 79.3%,23.5% 76.5%,20.7% 74.1%,17.4% 71.8%,13.7% 69.4%,9.8% 66.6%,6.2% 63.3%,3.2% 59.3%,1.2% 54.8%,0.5% 50.0%,1.2% 45.2%,3.2% 40.7%,6.2% 36.7%,9.8% 33.4%,13.7% 30.6%,17.4% 28.2%,20.7% 25.9%,23.5% 23.5%,25.9% 20.7%,28.2% 17.4%,30.6% 13.7%,33.4% 9.8%,36.7% 6.2%,40.7% 3.2%,45.2% 1.2%,50.0% 0.5%,54.8% 1.2%,59.3% 3.2%,63.3% 6.2%,66.6% 9.8%,69.4% 13.7%,71.8% 17.4%,74.1% 20.7%,76.5% 23.5%,79.3% 25.9%,82.6% 28.2%,86.3% 30.6%,90.2% 33.4%,93.8% 36.7%,96.8% 40.7%,98.8% 45.2%)
}
@media(prefers-color-scheme:dark){:root{
  --bg:#16121e;--surface:#221c2e;--card:#312842;--primary:#d0bcff;--on-primary:#381e72;
  --text:#ebe3f7;--muted:#b4abc5;--accent:#633b48;--on-accent:#ffd8e4;--bad:#ffb4ab
}}
*{box-sizing:border-box;margin:0}
body{font-family:"Google Sans",Roboto,system-ui,sans-serif;background:var(--bg);color:var(--text);height:100dvh;overflow:hidden}
#wp-layer{position:fixed;inset:0;z-index:-2;background-size:cover;background-position:center;opacity:0;pointer-events:none;transition:opacity .35s}
#wp-scrim{position:fixed;inset:0;z-index:-1;background:var(--bg);opacity:0;pointer-events:none;transition:opacity .35s}
body.has-wp #wp-layer{opacity:1}
body.has-wp #wp-scrim{opacity:.74}
#app{position:fixed;left:var(--sbw);right:0;top:0;bottom:var(--sbh);display:flex}
#list{width:320px;border-right:1px solid var(--surface);display:flex;flex-direction:column;background:transparent}
.list-top{padding:16px 14px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.list-top h2{font-size:22px;font-weight:700;letter-spacing:-.3px}
.m3-fab{border:0;border-radius:18px;background:var(--primary);color:var(--on-primary);padding:10px 16px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:transform .2s var(--spring),border-radius .2s var(--spring);box-shadow:0 3px 12px #0002}
.m3-fab:hover{transform:translateY(-1px)}
.m3-fab:active{transform:scale(.95);border-radius:26px}
.seg-tabs{display:flex;gap:4px;margin:0 14px 10px;padding:4px;background:var(--surface);border-radius:999px}
.seg-tab{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-size:12px;font-weight:700;padding:8px 6px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;transition:background .2s,color .2s}
.seg-tab.on{background:var(--primary);color:var(--on-primary)}
.seg-badge{background:var(--accent);color:var(--on-accent);font-size:10px;font-weight:800;padding:1px 6px;border-radius:999px}
.seg-tab.on .seg-badge{background:var(--on-primary);color:var(--primary)}
#fl{flex:1;overflow-y:auto;padding:4px 10px 16px;display:flex;flex-direction:column;gap:4px}
.sec-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);padding:10px 12px 4px}
.fr{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:24px;cursor:pointer;transition:background .18s,transform .18s var(--spring)}
.fr:hover,.fr.on{background:var(--surface)}
.fr:active{transform:scale(.98)}
.fr-meta{min-width:0;flex:1}
.fr-name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fr-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:46px;height:46px;border-radius:50%;clip-path:var(--m3-cookie-7);background:var(--card) center/cover;display:grid;place-items:center;font-weight:700;color:var(--primary);flex:none;transition:transform .25s var(--spring),box-shadow .15s}
.fr:hover .av{transform:scale(1.06)}
.av.grp{background:var(--accent);color:var(--on-accent);border-radius:16px;clip-path:var(--m3-cookie-4)}
.av.ai{background:var(--primary);color:var(--on-primary);border-radius:16px;clip-path:var(--m3-cookie-4)}

/* 3-Avatar Group Collage */
.av-collage{width:46px;height:46px;border-radius:16px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px;background:var(--surface);flex:none;box-shadow:0 2px 8px #0001}
.av-collage.c2{grid-template-rows:1fr}
.av-collage.c1{grid-template-columns:1fr;grid-template-rows:1fr;border-radius:50%}
.av-tile{background:var(--card) center/cover;display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--primary)}
.av-collage.c3 .av-tile:first-child{grid-row:1/3;font-size:15px}
.av-tile.t1{background-color:var(--accent);color:var(--on-accent)}
.av-tile.t2{background-color:var(--primary);color:var(--on-primary)}

.dot{width:10px;height:10px;border-radius:50%;background:var(--primary);margin-left:auto;display:none;flex:none}
.fr.unread .dot{display:block}
.u-badge{margin-left:auto;background:var(--primary);color:var(--on-primary);font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;flex:none}
.inv-card{background:var(--surface);border-radius:24px;padding:14px;margin:4px 2px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--card)}
.inv-top{display:flex;align-items:center;gap:10px}
.inv-acts{display:flex;gap:8px}
.pill-btn{flex:1;border:0;border-radius:999px;padding:9px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:transform .15s var(--spring)}
.pill-btn:active{transform:scale(.96)}
.pill-btn.p{background:var(--primary);color:var(--on-primary)}
.pill-btn.t{background:var(--card);color:var(--text)}
#chat{flex:1;display:flex;flex-direction:column;min-width:0}
#head{padding:12px 18px;font-weight:700;border-bottom:1px solid var(--surface);display:flex;align-items:center;gap:10px;background:transparent;flex-wrap:wrap}
.head-actions{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.head-chip{border:0;border-radius:999px;background:var(--surface);color:var(--text);padding:7px 13px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:transform .15s}
.head-chip:hover{background:var(--card)}
.head-chip.p{background:var(--primary);color:var(--on-primary)}
.head-chip.bad{background:var(--bad);color:#fff}
#callBar{background:var(--card);padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--surface)}
.call-peers{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:1;min-width:140px}
.peer-pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);padding:4px 10px 4px 5px;border-radius:999px;font-size:12px;font-weight:700;border:2px solid transparent;transition:border-color .15s,box-shadow .15s}
.peer-pill .av{width:26px;height:26px;font-size:11px}
.peer-pill.speaking{border-color:#22c55e;box-shadow:0 0 10px #22c55e55}
.call-ctrls{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

/* Full-screen Call + Web Tok Group Watch + Chat Sidebar */
#callScreen{position:fixed;inset:0;z-index:60;background:var(--bg);color:var(--text);display:flex;flex-direction:column}
.cs-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;border-bottom:1px solid var(--surface);flex-wrap:wrap;flex:none}
.cs-body{flex:1;min-height:0;display:flex}
.cs-stage{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;background:var(--bg)}
.cs-chat{width:340px;flex:none;border-left:1px solid var(--surface);display:flex;flex-direction:column;background:var(--bg);min-height:0}
.cs-grid{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,200px));gap:16px;place-content:center;padding:24px}
.cs-tile{background:var(--card);border-radius:28px;padding:22px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:0 6px 20px #0002;border:3px solid transparent;transition:border-color .15s,box-shadow .15s}
.cs-tile .av{width:76px;height:76px;font-size:28px;clip-path:none;border-radius:50%}
.cs-tile.speaking{border-color:#22c55e;box-shadow:0 0 22px #22c55e66}
.cs-tile.speaking .av{box-shadow:0 0 0 4px #22c55e,0 0 16px #22c55e99}
.gw-feed{flex:1;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;position:relative}
.gw-feed::-webkit-scrollbar{display:none}
.gw-slide{height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:14px;position:relative}
.gw-player{position:relative;flex:1;min-height:0;height:100%;aspect-ratio:9/16;max-width:100%;border-radius:28px;overflow:hidden;background:#000;box-shadow:0 12px 36px #0005}
.gw-player video{width:100%;height:100%;object-fit:cover;display:block}
.gw-cap{position:absolute;left:0;right:0;bottom:0;padding:32px 14px 14px;background:linear-gradient(transparent,#000b);color:#fff;font-size:13px;pointer-events:none}
.gw-react-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.react-float-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.react-pop{position:absolute;bottom:24px;display:flex;align-items:center;gap:4px;background:var(--surface);color:var(--text);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700;box-shadow:0 4px 14px #0004;animation:reactUp 2.2s ease-out forwards}
@keyframes reactUp{0%{opacity:0;transform:translateY(10px) scale(.8)}15%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-160px) scale(1.05)}}
.wb-wrap{flex:1;display:flex;flex-direction:column;gap:10px;padding:16px}
#wbCanvas{flex:1;width:100%;background:#fff;border-radius:24px;cursor:crosshair;touch-action:none;box-shadow:inset 0 0 0 1px var(--card)}
.wb-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wb-swatch{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.wb-swatch.on{border-color:var(--text);transform:scale(1.15)}

/* Mic Test Meter */
.mic-meter{height:14px;width:100%;background:var(--surface);border-radius:999px;overflow:hidden;margin:10px 0}
.mic-fill{height:100%;width:0%;background:#22c55e;border-radius:999px;transition:width .08s linear}
.mic-status{font-size:13px;font-weight:700;margin-bottom:10px;color:var(--muted)}
.mic-status.ok{color:#16a34a}
.mic-status.bad{color:var(--bad)}

#msgs{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:8px}
.m-wrap{display:flex;flex-direction:column;max-width:78%;align-self:flex-start;gap:3px}
.m-wrap.me{align-self:flex-end;align-items:flex-end}
.m-sender{font-size:11px;font-weight:700;color:var(--muted);padding:0 10px}
.m{padding:11px 16px;border-radius:22px 22px 22px 6px;background:var(--surface);word-break:break-word;line-height:1.4;white-space:pre-wrap}
.m-wrap.me .m{background:var(--primary);color:var(--on-primary);border-radius:22px 22px 6px 22px}
.vid-share-card{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:18px;background:var(--card);color:var(--text);text-decoration:none;margin-bottom:4px}
.m-wrap.me .vid-share-card{background:#fff2;color:var(--on-primary)}
.vid-share-ic{width:38px;height:38px;clip-path:var(--m3-cookie-4);background:var(--primary);color:var(--on-primary);display:grid;place-items:center;flex:none}
.m-wrap.me .vid-share-ic{background:var(--on-primary);color:var(--primary)}
#form{display:flex;gap:10px;padding:12px 16px;background:transparent}
#form input{flex:1;min-width:0;padding:14px 20px;border-radius:999px;border:2px solid transparent;background:var(--surface);color:var(--text);font:inherit;outline:0;transition:border-color .15s}
#form input:focus{border-color:var(--primary)}
#form button{border:0;border-radius:18px;background:var(--primary);color:var(--on-primary);width:50px;height:50px;cursor:pointer;display:grid;place-items:center;flex:none;transition:border-radius .2s var(--spring),transform .15s}
#form button:active{border-radius:999px;transform:scale(.95)}
.empty{margin:auto;color:var(--muted);text-align:center;padding:30px;max-width:34ch;line-height:1.5}
.hidden{display:none!important}
#stkPanel{max-height:200px;overflow-y:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px 16px;background:var(--surface);border-radius:24px 24px 0 0;margin:0 16px}
#stkPanel button{background:none!important;border:0;cursor:pointer;border-radius:16px;padding:4px;width:auto!important;height:auto!important}
#stkPanel button:hover{background:var(--card)!important}
#stkPanel button.stk-add{background:var(--card)!important;color:var(--primary);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;aspect-ratio:1;font-size:11px;font-weight:700}
#stkPanel img,#stkPanel .stk-box{width:100%;aspect-ratio:1;object-fit:contain;display:block;border-radius:12px}
#form #stkBtn{background:var(--surface);color:var(--text)}
.m.stk{background:none!important;padding:0}.m.stk img,.m.stk .stk-box{width:150px;height:150px;object-fit:contain;display:block;border-radius:16px}
#back{display:none;background:none;border:0;color:var(--text);cursor:pointer}
.m3-loader{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;margin:auto;padding:24px;color:var(--muted);font-size:13px;font-weight:600}
.m3-wave{width:160px;height:14px;overflow:hidden}
.m3-wave svg{width:200%;height:100%;animation:waveMove 1.1s linear infinite}
@keyframes waveMove{to{transform:translateX(-50%)}}
dialog{border:0;border-radius:32px;padding:24px;width:min(94vw,440px);background:var(--bg);color:var(--text);margin:auto;box-shadow:0 16px 48px #0004}
dialog::backdrop{background:#0006;backdrop-filter:blur(4px)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.dlg-head h3{font-size:20px;font-weight:700}
.dlg-in{width:100%;padding:14px 16px;border-radius:20px;border:2px solid transparent;background:var(--surface);color:var(--text);font:inherit;outline:0;margin-bottom:12px}
.dlg-in:focus{border-color:var(--primary)}
.pick-list{max-height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.pick-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:18px;background:var(--surface);cursor:pointer}
.pick-row input{accent-color:var(--primary);width:18px;height:18px}
.dlg-foot{display:flex;gap:8px;justify-content:flex-end}
@media(max-width:800px){
  #list{width:100%}#chat{display:none}body.chatting #list{display:none}body.chatting #chat{display:flex}#back{display:block}
  .cs-body{flex-direction:column}.cs-chat{width:100%;height:42dvh;border-left:0;border-top:1px solid var(--surface)}
}
.av-wrap{position:relative;flex:none;display:inline-flex}
.on-dot{position:absolute;right:0;bottom:0;width:12px;height:12px;border-radius:50%;border:2px solid var(--bg);background:var(--muted);opacity:.55;pointer-events:none}
.on-dot.on{background:#22c55e;opacity:1}
.head-sub{font-size:12px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:5px}
.st-pill{display:inline-flex;align-items:center;gap:4px;font-weight:700}
.st-pill.on{color:#16a34a}
@media(prefers-color-scheme:dark){.st-pill.on{color:#4ade80}}
.st-dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.m-receipt{font-size:11px;color:var(--muted);padding:0 6px;font-weight:600;line-height:1.2}
@keyframes msgPop{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
@keyframes chatIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
@keyframes dlgIn{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:none}}
.m-wrap{animation:msgPop .22s var(--spring)}
#head,#msgs{animation:chatIn .22s var(--spring)}
dialog[open]{animation:dlgIn .22s var(--spring)}
</style></head>
<body data-page="messages">
<div id="wp-layer"></div>
<div id="wp-scrim"></div>
<div id="app">
 <aside id="list">
  <div class="list-top">
    <h2>Messages</h2>
    <button class="m3-fab" id="btnNewGroup"><span class="ms" style="font-size:18px">group_add</span>Group</button>
  </div>
  <div class="seg-tabs">
    <button class="seg-tab on" data-tab="all">All</button>
    <button class="seg-tab" data-tab="friends">Friends</button>
    <button class="seg-tab" data-tab="groups">Groups</button>
    <button class="seg-tab" data-tab="invites">Invites <span class="seg-badge hidden" id="invBadge">0</span></button>
  </div>
  <div id="fl">
    <div class="m3-loader"><div class="m3-wave"><svg viewBox="0 0 160 14" fill="none"><path d="M0 7 Q10 1 20 7 T40 7 T60 7 T80 7 T100 7 T120 7 T140 7 T160 7" stroke="var(--primary)" stroke-width="3.2" stroke-linecap="round"/></svg></div><span>Loading chats…</span></div>
  </div>
 </aside>
 <section id="chat"><div class="empty" id="ph">Pick a friend, group chat, or Web Tok AI to start messaging!</div></section>
</div>

<div id="callScreen" class="hidden">
  <div class="cs-top" id="csTop"></div>
  <div class="cs-body">
    <div class="cs-stage" id="csStage"></div>
    <div class="cs-chat" id="csChat"></div>
  </div>
</div>

<dialog id="newGroupDlg">
  <div class="dlg-head"><h3>New group chat</h3><button class="head-chip" aria-label="Close" onclick="document.getElementById('newGroupDlg').close()"><span class="ms" style="font-size:18px">close</span></button></div>
  <input class="dlg-in" id="ngName" maxlength="40" placeholder="Group name (e.g. Comedy Squad)">
  <div style="font-size:12px;color:var(--muted);margin:0 4px 8px">Select friends to send an invite:</div>
  <div class="pick-list" id="ngFriends"></div>
  <div id="ngHint" style="font-size:12px;color:var(--bad);min-height:16px;margin-bottom:8px"></div>
  <div class="dlg-foot">
    <button class="pill-btn t" style="flex:0" onclick="document.getElementById('newGroupDlg').close()">Cancel</button>
    <button class="pill-btn p" style="flex:0;white-space:nowrap" id="ngSubmit">Send invites</button>
  </div>
</dialog>

<dialog id="invMoreDlg">
