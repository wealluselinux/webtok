<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Web Tok · Profile</title>
<link rel="icon" href="/images/logo.png">
<link rel="stylesheet" href="/css/profile-base.css">
<link rel="stylesheet" href="/css/profile.css">
<link rel="stylesheet" href="/css/profile-dialogs.css">
<link rel="stylesheet" href="/css/profile-upload.css">
<link rel="stylesheet" href="/css/profile-settings.css">
</head>
<body>
<div id="wp-layer"></div>
<div id="wp-scrim"></div>

<div id="bar">
  <a class="chip" href="/scroll"><span class="ms">arrow_back</span>Feed</a>
  <button class="chip p hidden" id="openUpload"><span class="ms">add</span>Upload</button>
</div>

<main class="acct-wrap">
  <div class="profile-card">
    <div class="pfp" id="p-pfp">?</div>
    <div class="p-info">
      <div class="p-names">
        <h1 id="p-display">Loading…</h1>
        <span id="p-user"></span>
      </div>
      <div class="p-stats">
        <button id="btn-following-list"><b id="st-following">0</b> Following</button>
        <button id="btn-followers-list"><b id="st-followers">0</b> Followers</button>
        <span><b id="st-likes">0</b> Likes</span>
        <span><b id="st-comments">0</b> Comments</span>
      </div>
      <div class="p-actions" id="p-actions-me">
        <button class="btn primary sm" id="btn-edit-prof"><span class="ms" style="font-size:18px">edit</span>Edit profile</button>
        <button class="btn tonal sm" id="btn-upload-acct"><span class="ms" style="font-size:18px">upload</span>Upload videos</button>
        <button class="btn icon" id="btn-settings" title="Theme & Settings" aria-label="Theme & Settings"><span class="ms">settings</span></button>
        <button class="btn sm" id="btn-switch-acct">Switch account</button>
        <button class="btn sm" id="btn-signout">Sign out</button>
      </div>
      <div class="p-actions hidden" id="p-actions-other">
        <button class="btn primary sm" id="btn-follow-user">Follow</button>
        <a class="btn tonal sm" href="/messages">Message</a>
      </div>
      <p class="p-bio" id="p-bio"></p>
    </div>
  </div>

  <div class="tabs">
    <button class="tab on" data-tab="posted">Videos</button>
    <button class="tab" data-tab="liked">Liked</button>
    <button class="tab" data-tab="comments">Comments</button>
  </div>

  <div id="acct-content"><div class="empty-box">Loading…</div></div>
</main>

<!-- Switch Account Modal -->
<dialog id="switchDlg">
  <div class="dlg-head">
    <h2>Switch account</h2>
    <button class="btn icon" aria-label="Close" onclick="document.getElementById('switchDlg').close()"><span class="ms">close</span></button>
  </div>
  <div class="u-list" id="sw-list"></div>
  <div class="hint" id="sw-hint"></div>
  <div class="row" style="justify-content:space-between">
    <a class="btn tonal sm" href="/login?add=1" style="text-decoration:none"><span class="ms" style="font-size:18px">person_add</span>Add account</a>
    <button class="btn sm" onclick="document.getElementById('switchDlg').close()">Close</button>
  </div>
</dialog>

<!-- Followers / Following Modal -->
<dialog id="followListDlg">
  <div class="dlg-head">
    <h2 id="fl-title">Followers</h2>
    <button class="btn icon" aria-label="Close" onclick="document.getElementById('followListDlg').close()"><span class="ms">close</span></button>
  </div>
  <div class="u-list" id="fl-list"></div>
</dialog>

<!-- Full-Screen Batch Upload Videos Modal -->
<dialog id="uploadDlg">
  <div class="up-top">
    <div style="display:flex;align-items:center;gap:12px">
      <button type="button" class="btn icon" aria-label="Close" onclick="document.getElementById('uploadDlg').close()"><span class="ms">close</span></button>
      <h2>Upload videos</h2>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <span class="hint" id="upHint" style="margin:0"></span>
      <button type="button" class="btn primary" id="upSubmit">Upload all</button>
    </div>
  </div>
  <div class="up-body">
    <label class="up-drop" for="upFile">
      <b>Choose videos to upload</b>
      <span>MP4, WebM, or MOV · Up to 50 MB each · Select multiple at once</span>
    </label>
    <input type="file" id="upFile" accept="video/mp4,video/webm,video/quicktime" multiple hidden>
    <div class="up-bar-wrap hidden" id="upBarWrap">
      <div class="up-bar-head">
        <span id="upPhase">Preparing…</span>
        <span id="upStats" style="color:var(--primary)">0%</span>
      </div>
      <div class="up-bar-track"><div class="up-bar-fill" id="upBarFill"></div></div>
    </div>
    <div class="up-list" id="upQueue"></div>
  </div>
</dialog>

<!-- Edit Profile Modal -->
<dialog id="editProfDlg">
  <div class="dlg-head">
    <h2>Edit profile</h2>
    <button class="btn icon" aria-label="Close" onclick="document.getElementById('editProfDlg').close()"><span class="ms">close</span></button>
  </div>
  <div class="pfp" id="ep-av" style="margin:0 auto 10px;cursor:pointer;width:88px;height:88px" title="Change avatar"><span class="ms" style="font-size:32px">photo_camera</span></div>
  <input type="file" id="ep-file" accept="image/*" hidden>
  <label class="fld">Display name</label>
  <input type="text" id="ep-display" maxlength="40">
  <label class="fld">Username</label>
  <input type="text" id="ep-user" maxlength="20">
  <label class="fld">Bio</label>
  <textarea id="ep-bio" maxlength="160"></textarea>
  <div class="hint" id="ep-hint"></div>
  <div class="row">
    <button class="btn sm" onclick="document.getElementById('editProfDlg').close()">Cancel</button>
    <button class="btn primary sm" id="ep-save">Save</button>
  </div>
</dialog>

<!-- Settings (Material You Theme, Wallpaper & Delete Account) Modal -->
<dialog id="settingsDlg">
  <div class="dlg-head">
    <h2>Material You Settings</h2>
    <button class="btn icon" aria-label="Close" onclick="document.getElementById('settingsDlg').close()"><span class="ms">close</span></button>
  </div>
  <label class="fld">Appearance</label>
  <select id="st-mode">
    <option value="auto">System default</option>
    <option value="light">Light</option>
    <option value="dark">Dark</option>
  </select>

  <label class="fld">Color palette</label>
  <div class="swatches" id="st-swatches"></div>
  <div class="color-row">
    <input type="color" id="st-custom-color" value="#6750a4">
    <span style="font-size:14px">Custom accent color</span>
  </div>

  <label class="fld" style="margin-top:14px">Wallpaper</label>
  <div class="wp-grid" id="st-wps"></div>
  <div class="row" style="justify-content:space-between">
    <button class="btn sm" id="st-wp-upload"><span class="ms" style="font-size:18px">wallpaper</span>Upload wallpaper</button>
    <button class="btn sm" id="st-reset">Reset default</button>
  </div>
  <input type="file" id="st-wp-file" accept="image/*" hidden>

  <hr style="border:0;border-top:1px solid var(--surface);margin:18px 0 12px">
  <button class="btn danger sm" id="btn-del-acct" style="width:100%">Delete account</button>
  <div class="hint" id="st-del-hint"></div>
</dialog>

<script src="/config.js"></script>
<script src="/js/wt-local.js"></script>
<script src="/js/profile-core.js"></script>
<script src="/js/profile-theme.js"></script>
<script src="/js/profile-data.js"></script>
<script src="/js/profile-follows.js"></script>
<script src="/js/profile-upload.js"></script>
<script src="/js/profile-edit.js"></script>
<script src="/js/profile-settings.js"></script>
<script src="/js/profile-switch.js"></script>
<script src="/js/profile-init.js"></script>
</body>
</html>
