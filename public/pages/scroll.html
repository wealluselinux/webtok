<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Web Tok · Scroll</title>
<link rel="icon" href="/images/logo.png">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/feed.css">
<link rel="stylesheet" href="/css/comments.css">
</head>
<body data-page="scroll">
<div id="wp-layer"></div>
<div id="wp-scrim"></div>
<div id="bar">
  <button class="chip" id="home">Web Tok</button>
  <div class="bar-right">
    <button class="chip p hidden" id="openUpload">+ Upload</button>
    <button class="chip" id="acct">Sign in</button>
  </div>
</div>

<main id="feed"></main>
<div id="vnav"><button id="vprev" aria-label="Previous video"><span class="ms">keyboard_arrow_up</span></button><button id="vnext" aria-label="Next video"><span class="ms">keyboard_arrow_down</span></button></div>

<dialog id="commentsDlg">
  <div class="dlg-head"><h2>Comments <span id="cmtCount" style="color:var(--muted);font-weight:400"></span></h2>
    <button class="btn icon" aria-label="Close" onclick="document.getElementById('commentsDlg').close()"><span class="ms">close</span></button></div>
  <div class="cmt-list" id="cmtList"></div>
  <div id="stkPanel" class="hidden"></div>
  <form class="cmt-form" id="cmtForm">
    <input type="text" id="cmtInput" placeholder="Add comment…" maxlength="500" autocomplete="off">
    <button type="button" class="btn icon" id="stkBtn" aria-label="Stickers"><span class="ms">emoji_emotions</span></button>
    <button class="btn primary sm" type="submit" aria-label="Send"><span class="ms">send</span></button>
  </form>
  <div class="hint" id="cmtHint"></div>
</dialog>

<dialog id="uploadDlg">
  <div class="dlg-head">
    <h2>Upload video</h2>
    <button class="btn icon" onclick="document.getElementById('uploadDlg').close()"><span class="ms">close</span></button>
  </div>
  <label class="fld">Video file (MP4, WebM, MOV)</label>
  <input type="file" id="upFile" accept="video/mp4,video/webm,video/quicktime" style="padding:10px;background:var(--surface);border-radius:var(--r-lg);width:100%">
  <label class="fld">Caption / Title</label>
  <input type="text" id="upTitle" placeholder="What's this video about?" maxlength="100">
  <div class="hint" id="upHint"></div>
  <div class="row" style="justify-content:flex-end;margin-top:12px">
    <button class="btn sm" onclick="document.getElementById('uploadDlg').close()">Cancel</button>
    <button class="btn primary sm" id="upSubmit">Upload</button>
  </div>
</dialog>
<script src="/config.js"></script>
<script src="/js/wt-local.js"></script>
<script src="/js/sidebar.js"></script>
<script src="/js/core.js"></script>
<script src="/js/theme.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/social.js"></script>
<script src="/js/tags.js"></script>
<script src="/js/fyp.js"></script>
<script src="/js/feed.js"></script>
<script src="/js/comments.js"></script>
<script src="/js/stickers.js"></script>
<script src="/js/upload.js"></script>
<script src="/js/scroll-init.js"></script>
</body>
</html>
