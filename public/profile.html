<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Web Tok · Profile</title>
<style>
:root{
  --bg:#fff0ee; --surface:#ffe3e8; --card:#fbd5de; --primary:#7b3f8c; --on-primary:#fff;
  --text:#3b1f2b; --muted:#85626f; --accent:#ffd58a; --mint:#cfe8d5; --ok:#2e7d4f; --bad:#b3261e;
  --r-xl:32px; --r-lg:24px; --r-md:18px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#22141b; --surface:#33202a; --card:#47303c; --primary:#e7b6f2; --on-primary:#3a1745;
    --text:#f7dde5; --muted:#c3a1ae; --accent:#6b5320; --mint:#2e4a37; --ok:#8fd5a6; --bad:#ffb4ab}
}
*{box-sizing:border-box;margin:0}
body{font-family:"Google Sans","Roboto",system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding:76px 16px 40px;transition:background-color .25s,color .25s}
#wp-layer{position:fixed;inset:0;z-index:-2;background-size:cover;background-position:center;opacity:0;pointer-events:none;transition:opacity .3s}
#wp-scrim{position:fixed;inset:0;z-index:-1;background:var(--bg);opacity:0;pointer-events:none;transition:opacity .3s}
body.has-wp #wp-layer{opacity:1}
body.has-wp #wp-scrim{opacity:.76}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
.hidden{display:none!important}

/* top bar */
#bar{position:fixed;top:12px;left:12px;right:12px;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none}
#bar>*{pointer-events:auto}
.chip{padding:9px 16px;border-radius:999px;background:var(--surface);font-weight:600;box-shadow:0 2px 10px #0002;display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:inherit}
.chip.p{background:var(--primary);color:var(--on-primary)}

.btn{padding:12px 22px;border-radius:999px;font-weight:600;background:var(--surface);color:var(--text);transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.tonal{background:var(--card);color:var(--text)}
.btn.sm{padding:10px 18px;font-size:14px}
.btn.icon{width:42px;height:42px;padding:0;display:grid;place-items:center;border-radius:16px;background:var(--surface)}
.btn:disabled{opacity:.45;cursor:default}

/* profile layout */
.acct-wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.profile-card{background:var(--card);border-radius:var(--r-xl);padding:24px;display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap;box-shadow:0 4px 20px #0001}
.pfp{width:104px;height:104px;border-radius:38% 62% 55% 45%;background:var(--surface) center/cover;display:grid;place-items:center;font-size:38px;font-weight:700;color:var(--primary);flex-shrink:0;box-shadow:0 4px 12px #0001}
.p-info{flex:1;min-width:240px}
.p-names{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.p-names h1{font-size:24px;font-weight:700}
.p-names span{color:var(--muted);font-size:15px}
.p-stats{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0 14px;font-size:14px}
.p-stats button,.p-stats span{color:var(--muted);padding:0;font-size:14px}
.p-stats button:hover{text-decoration:underline;color:var(--text)}
.p-stats b{font-weight:700;color:var(--text)}
.p-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.p-bio{font-size:14px;line-height:1.45;color:var(--text);white-space:pre-wrap}

.tabs{display:inline-flex;gap:6px;background:var(--surface);padding:6px;border-radius:999px;align-self:flex-start}
.tab{padding:10px 20px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted);transition:background .15s,color .15s}
.tab.on{background:var(--primary);color:var(--on-primary)}

.vid-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.vid-tile{position:relative;aspect-ratio:9/16;border-radius:var(--r-lg);overflow:hidden;background:var(--card);cursor:pointer;box-shadow:0 4px 14px #0002}
.vid-tile video{width:100%;height:100%;object-fit:cover;display:block}
.vid-tile .v-ov{position:absolute;inset:auto 0 0 0;padding:28px 12px 10px;background:linear-gradient(transparent,#000a);color:#fff;font-size:13px}
.vid-tile .v-ov b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vid-tile .v-ov span{font-size:12px;opacity:.9}

.cmt-feed{display:flex;flex-direction:column;gap:10px}
.cmt-card{background:var(--card);border-radius:var(--r-lg);padding:14px 18px;cursor:pointer}
.cmt-card .meta{font-size:12px;color:var(--muted);margin-bottom:4px;display:flex;justify-content:space-between;gap:8px}
.empty-box{background:var(--surface);border-radius:var(--r-xl);padding:36px 20px;text-align:center;color:var(--muted)}

/* dialogs */
dialog{border:0;border-radius:var(--r-xl);padding:24px;width:min(94vw,460px);background:var(--bg);color:var(--text);margin:auto;box-shadow:0 12px 40px #0004}
dialog::backdrop{background:#0007;backdrop-filter:blur(3px)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.dlg-head h2{font-size:20px;font-weight:700}
label.fld{display:block;font-size:13px;color:var(--muted);margin:10px 4px 5px}
input[type=text],textarea,select{width:100%;padding:14px 16px;border-radius:var(--r-lg);border:2px solid transparent;background:var(--surface);color:var(--text);font:inherit}
textarea{resize:vertical;min-height:80px}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--primary)}
.hint{min-height:18px;margin:8px 4px;color:var(--muted);font-size:13px}
.hint.bad{color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:12px}

/* followers list modal */
.u-list{max-height:55vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.u-row{display:flex;align-items:center;gap:12px;background:var(--surface);padding:10px 14px;border-radius:var(--r-lg)}
.u-av{width:40px;height:40px;border-radius:38% 62% 55% 45%;background:var(--card) center/cover;display:grid;place-items:center;font-weight:700;color:var(--primary);flex-shrink:0}
.u-meta{flex:1;min-width:0;text-decoration:none;color:inherit}
.u-meta b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u-meta small{display:block;font-size:12px;color:var(--muted)}

/* batch upload queue */
.up-queue{display:flex;flex-direction:column;gap:8px;max-height:42vh;overflow-y:auto;margin-top:10px}
.up-item{background:var(--surface);padding:10px 12px;border-radius:18px;display:flex;flex-direction:column;gap:6px}
.up-item-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.up-item-row{display:flex;gap:6px;align-items:center}
.up-item-row input{padding:10px 12px;background:var(--bg)}

/* settings swatches & wallpapers */
.swatches{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 12px}
.swatch{width:38px;height:38px;border-radius:50%;border:3px solid transparent;cursor:pointer;transition:transform .15s}
.swatch.on{border-color:var(--text);transform:scale(1.1)}
.wp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 12px}
.wp-opt{height:54px;border-radius:16px;border:2px solid transparent;background:var(--surface);background-size:cover;background-position:center;font-size:12px;font-weight:600;display:grid;place-items:center}
.wp-opt.on{border-color:var(--primary)}
.color-row{display:flex;align-items:center;gap:10px;background:var(--surface);padding:10px 14px;border-radius:var(--r-lg)}
.color-row input[type=color]{width:42px;height:34px;border:0;background:none;cursor:pointer;padding:0}
</style>
</head>
<body>
<div id="wp-layer"></div>
<div id="wp-scrim"></div>

<div id="bar">
  <a class="chip" href="/scroll">← Feed</a>
  <button class="chip p hidden" id="openUpload">+ Upload</button>
</div>

<main class="acct-wrap">
  <div class="profile-card">
    <div class="pfp" id="p-pfp">?</div>
    <div class="p-info">
      <div class="p-names">
        <h1 id="p-display">Loading…</h1>
        <span id="p-user"></span>
      </div>
      <div class="p-stats">
        <button id="btn-following-list"><b id="st-following">0</b> Following</button>
        <button id="btn-followers-list"><b id="st-followers">0</b> Followers</button>
        <span><b id="st-likes">0</b> Likes</span>
        <span><b id="st-comments">0</b> Comments</span>
      </div>
      <div class="p-actions" id="p-actions-me">
        <button class="btn primary sm" id="btn-edit-prof">Edit profile</button>
        <button class="btn tonal sm" id="btn-upload-acct">+ Upload videos</button>
        <button class="btn icon" id="btn-settings" title="Theme & Settings">⚙</button>
        <button class="btn sm" id="btn-signout">Sign out</button>
      </div>
      <div class="p-actions hidden" id="p-actions-other">
        <button class="btn primary sm" id="btn-follow-user">Follow</button>
        <a class="btn tonal sm" href="/messages">Message</a>
      </div>
      <p class="p-bio" id="p-bio"></p>
    </div>
  </div>

  <div class="tabs">
    <button class="tab on" data-tab="posted">Videos</button>
    <button class="tab" data-tab="liked">Liked</button>
    <button class="tab" data-tab="comments">Comments</button>
  </div>

  <div id="acct-content"><div class="empty-box">Loading…</div></div>
</main>

<!-- Followers / Following Modal -->
<dialog id="followListDlg">
  <div class="dlg-head">
    <h2 id="fl-title">Followers</h2>
    <button class="btn icon" onclick="document.getElementById('followListDlg').close()">✕</button>
  </div>
  <div class="u-list" id="fl-list"></div>
</dialog>

<!-- Batch Upload Videos Modal -->
<dialog id="uploadDlg">
  <div class="dlg-head">
    <h2>Upload videos</h2>
    <button class="btn icon" onclick="document.getElementById('uploadDlg').close()">✕</button>
  </div>
  <label class="fld">Select one or more videos (MP4, WebM, MOV)</label>
  <input type="file" id="upFile" accept="video/mp4,video/webm,video/quicktime" multiple style="padding:10px;background:var(--surface);border-radius:var(--r-lg);width:100%">
  <div class="up-queue" id="upQueue"></div>
  <div class="hint" id="upHint"></div>
  <div class="row">
    <button class="btn sm" onclick="document.getElementById('uploadDlg').close()">Cancel</button>
    <button class="btn primary sm" id="upSubmit">Upload all</button>
  </div>
</dialog>

<!-- Edit Profile Modal -->
<dialog id="editProfDlg">
  <div class="dlg-head">
    <h2>Edit profile</h2>
    <button class="btn icon" onclick="document.getElementById('editProfDlg').close()">✕</button>
  </div>
  <div class="pfp" id="ep-av" style="margin:0 auto 10px;cursor:pointer;width:88px;height:88px" title="Change avatar">📷</div>
  <input type="file" id="ep-file" accept="image/*" hidden>
  <label class="fld">Display name</label>
  <input type="text" id="ep-display" maxlength="40">
  <label class="fld">Username</label>
  <input type="text" id="ep-user" maxlength="20">
  <label class="fld">Bio</label>
  <textarea id="ep-bio" maxlength="160"></textarea>
  <div class="hint" id="ep-hint"></div>
  <div class="row">
    <button class="btn sm" onclick="document.getElementById('editProfDlg').close()">Cancel</button>
    <button class="btn primary sm" id="ep-save">Save</button>
  </div>
</dialog>

<!-- Settings (Material You Theme & Wallpaper) Modal -->
<dialog id="settingsDlg">
  <div class="dlg-head">
    <h2>Material You Settings</h2>
    <button class="btn icon" onclick="document.getElementById('settingsDlg').close()">✕</button>
  </div>
  <label class="fld">Appearance</label>
  <select id="st-mode">
    <option value="auto">System default</option>
    <option value="light">Light</option>
    <option value="dark">Dark</option>
  </select>

  <label class="fld">Color palette</label>
  <div class="swatches" id="st-swatches"></div>
  <div class="color-row">
    <input type="color" id="st-custom-color" value="#7b3f8c">
    <span style="font-size:14px">Custom accent color</span>
  </div>

  <label class="fld" style="margin-top:14px">Wallpaper</label>
  <div class="wp-grid" id="st-wps"></div>
  <div class="row" style="justify-content:space-between">
    <button class="btn sm" id="st-wp-upload">Upload wallpaper</button>
    <button class="btn sm" id="st-reset">Reset default</button>
  </div>
  <input type="file" id="st-wp-file" accept="image/*" hidden>
</dialog>

<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const { SUPABASE_URL, SUPABASE_ANON_KEY } = window.WT_CONFIG || {};
const $ = id => document.getElementById(id);
let sb = null, user = null, profile = null, targetId = null, isMe = false, acctData = null, acctTab = "posted";
let myFollowing = new Set(), myFollowers = new Set();
try { sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); } catch (e) { console.warn(e); }

/* ---------- Material You Theme Engine ---------- */
const PRESETS = [
  { name: "Berry", hex: "#7b3f8c" },
  { name: "Sage", hex: "#386a4b" },
  { name: "Ocean", hex: "#25638f" },
  { name: "Terracotta", hex: "#9b4534" },
  { name: "Lavender", hex: "#5b5399" }
];
const WP_PRESETS = [
  { id: "none", label: "None", css: "" },
  { id: "rose", label: "Rose Aura", css: "radial-gradient(circle at 20% 20%, #ffd58a99, transparent 50%), radial-gradient(circle at 80% 80%, #e7b6f299, transparent 55%), linear-gradient(135deg, #fff0ee, #fbd5de)" },
  { id: "mint", label: "Mint Mist", css: "radial-gradient(circle at 80% 20%, #cfe8d5, transparent 55%), linear-gradient(135deg, #eefaf2, #d3ecdc)" },
  { id: "dusk", label: "Dusk", css: "radial-gradient(circle at 30% 20%, #7b3f8c88, transparent 55%), linear-gradient(135deg, #22141b, #47303c)" },
  { id: "sky", label: "Sky", css: "radial-gradient(circle at 75% 25%, #bae6fd, transparent 50%), linear-gradient(135deg, #f0f9ff, #dbeafe)" }
];
function hexToHsl(hex) {
  let r = parseInt(hex.slice(1,3),16)/255, g = parseInt(hex.slice(3,5),16)/255, b = parseInt(hex.slice(5,7),16)/255;
  const max = Math.max(r,g,b), min = Math.min(r,g,b);
  let h = 0, s = 0;
  if (max !== min) {
    const d = max - min, l = (max+min)/2;
    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
    if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h /= 6;
  }
  return [Math.round(h*360), Math.round(s*100)];
}
function getTheme() { try { return JSON.parse(localStorage.getItem("wt_theme") || "{}"); } catch { return {}; } }
async function saveTheme(patch) {
  const next = { ...getTheme(), ...patch };
  try { localStorage.setItem("wt_theme", JSON.stringify(next)); } catch {}
  applyTheme(next);
  if (sb && user && isMe) { try { await sb.from("profiles").update({ theme: next }).eq("id", user.id); } catch {} }
  return next;
}
function applyTheme(t = getTheme()) {
  const root = document.documentElement;
  const sysDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  const isDark = t.mode === "dark" ? true : t.mode === "light" ? false : sysDark;
  const [h, s] = hexToHsl(t.color || "#7b3f8c");
  const sat = Math.min(Math.max(s, 22), 58);
  if (isDark) {
    root.style.setProperty("--bg", `hsl(${h}, ${Math.round(sat*0.45)}%, 10%)`);
    root.style.setProperty("--surface", `hsl(${h}, ${Math.round(sat*0.45)}%, 16%)`);
    root.style.setProperty("--card", `hsl(${h}, ${Math.round(sat*0.42)}%, 23%)`);
    root.style.setProperty("--primary", `hsl(${h}, ${Math.min(sat+18,80)}%, 80%)`);
    root.style.setProperty("--on-primary", `hsl(${h}, ${sat}%, 18%)`);
    root.style.setProperty("--text", `hsl(${h}, 30%, 92%)`);
    root.style.setProperty("--muted", `hsl(${h}, 20%, 72%)`);
    root.style.setProperty("--accent", `hsl(${(h+45)%360}, 40%, 28%)`);
  } else {
    root.style.setProperty("--bg", `hsl(${h}, ${Math.round(sat*0.6)}%, 96%)`);
    root.style.setProperty("--surface", `hsl(${h}, ${Math.round(sat*0.6)}%, 91%)`);
    root.style.setProperty("--card", `hsl(${h}, ${Math.round(sat*0.58)}%, 88%)`);
    root.style.setProperty("--primary", `hsl(${h}, ${sat}%, 38%)`);
    root.style.setProperty("--on-primary", "#ffffff");
    root.style.setProperty("--text", `hsl(${h}, 35%, 16%)`);
    root.style.setProperty("--muted", `hsl(${h}, 18%, 42%)`);
    root.style.setProperty("--accent", `hsl(${(h+45)%360}, 85%, 78%)`);
  }
  const wp = $("wp-layer");
  if (t.wallpaper) {
    document.body.classList.add("has-wp");
    wp.style.backgroundImage = t.wallpaper.startsWith("url(") || t.wallpaper.includes("gradient") ? t.wallpaper : `url(${t.wallpaper})`;
  } else {
    document.body.classList.remove("has-wp");
    wp.style.backgroundImage = "";
  }
}
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => applyTheme());
applyTheme();

/* ---------- Load Profile & Account Data ---------- */
async function loadMyFollows() {
  myFollowing = new Set(); myFollowers = new Set();
  if (!user) return;
  const [a, b] = await Promise.all([
    sb.from("follows").select("following_id").eq("follower_id", user.id),
    sb.from("follows").select("follower_id").eq("following_id", user.id)
  ]);
  (a.data || []).forEach(r => myFollowing.add(r.following_id));
  (b.data || []).forEach(r => myFollowers.add(r.follower_id));
}

async function resolveTargetAndLoad() {
  const qs = new URLSearchParams(location.search);
  const qUser = qs.get("u"), qId = qs.get("id");
  let row = null;
  if (qUser) {
    const { data } = await sb.from("profiles").select("*").eq("username", qUser).maybeSingle();
    row = data;
  } else if (qId) {
    const { data } = await sb.from("profiles").select("*").eq("id", qId).maybeSingle();
    row = data;
  } else if (user) {
    const { data } = await sb.from("profiles").select("*").eq("id", user.id).maybeSingle();
    row = data;
  } else {
    location.href = "/login";
    return;
  }

  if (!row && (qUser || qId)) {
    $("p-display").textContent = "User not found";
    $("p-user").textContent = qUser ? "@" + qUser : "";
    $("p-actions-me").classList.add("hidden");
    $("acct-content").innerHTML = '<div class="empty-box">This profile doesn\'t exist.</div>';
    return;
  }

  targetId = row?.id || user.id;
  isMe = !!(user && targetId === user.id);
  const meta = isMe ? (user.user_metadata || {}) : {};
  profile = {
    id: targetId,
    username: row?.username || meta.username || (isMe ? (user.email || "user").split("@")[0] : "user"),
    display_name: row?.display_name || meta.display_name || row?.username || "Web Tok User",
    bio: row?.bio ?? meta.bio ?? "",
    avatar_url: row?.avatar_url || null
  };

  if (isMe && row?.theme && Object.keys(row.theme).length) {
    try { localStorage.setItem("wt_theme", JSON.stringify(row.theme)); } catch {}
    applyTheme(row.theme);
  }

  $("openUpload").classList.toggle("hidden", !isMe);
  $("p-actions-me").classList.toggle("hidden", !isMe);
  $("p-actions-other").classList.toggle("hidden", isMe);
  if (!isMe) paintOtherFollowBtn();

  paintProfileHeader();
  await loadAccountData();
}

function paintOtherFollowBtn() {
  const btn = $("btn-follow-user");
  const isF = myFollowing.has(targetId);
  const isBack = myFollowers.has(targetId);
  btn.textContent = isF ? (isBack ? "Friends" : "Following") : (isBack ? "Follow back" : "Follow");
  btn.className = "btn sm " + (isF ? "tonal" : "primary");
}

$("btn-follow-user").onclick = async () => {
  if (!user) return location.href = "/login";
  const was = myFollowing.has(targetId);
  if (was) {
    await sb.from("follows").delete().eq("follower_id", user.id).eq("following_id", targetId);
    myFollowing.delete(targetId);
  } else {
    await sb.from("follows").insert({ follower_id: user.id, following_id: targetId });
    myFollowing.add(targetId);
  }
  paintOtherFollowBtn();
  await loadAccountData();
};

function paintProfileHeader() {
  const pfp = $("p-pfp");
  if (profile.avatar_url) { pfp.style.backgroundImage = `url(${profile.avatar_url})`; pfp.textContent = ""; }
  else { pfp.style.backgroundImage = ""; pfp.textContent = (profile.display_name || profile.username || "U")[0].toUpperCase(); }
  $("p-display").textContent = profile.display_name;
  $("p-user").textContent = "@" + profile.username;
  $("p-bio").textContent = profile.bio || "No bio yet.";
}

async function loadAccountData() {
  $("acct-content").innerHTML = '<div class="empty-box">Loading…</div>';
  try {
    const [postedRes, myLikesRes, myCmtsRes, followingRes, followersRes] = await Promise.all([
      sb.from("videos").select("id, title, video_url, created_at").eq("user_id", targetId).order("created_at", { ascending: false }),
      sb.from("likes").select("video_id").eq("user_id", targetId),
      sb.from("comments").select("id, video_id, text, created_at").eq("user_id", targetId).order("created_at", { ascending: false }),
      sb.from("follows").select("following_id", { count: "exact", head: true }).eq("follower_id", targetId),
      sb.from("follows").select("follower_id", { count: "exact", head: true }).eq("following_id", targetId)
    ]);

    const postedRows = postedRes.data || [];
    const likedIds = (myLikesRes.data || []).map(l => l.video_id);
    const myCmts = myCmtsRes.data || [];

    const allRelevantIds = [...new Set([...postedRows.map(v => v.id), ...likedIds, ...myCmts.map(c => c.video_id)])];
    const [allLikesRes, allCmtsRes, likedVidsRes] = await Promise.all([
      allRelevantIds.length ? sb.from("likes").select("video_id").in("video_id", allRelevantIds) : { data: [] },
      allRelevantIds.length ? sb.from("comments").select("video_id").in("video_id", allRelevantIds) : { data: [] },
      allRelevantIds.length ? sb.from("videos").select("id, title, video_url, created_at").in("id", allRelevantIds) : { data: [] }
    ]);

    const lCounts = {}, cCounts = {};
    (allLikesRes.data || []).forEach(l => lCounts[l.video_id] = (lCounts[l.video_id] || 0) + 1);
    (allCmtsRes.data || []).forEach(c => cCounts[c.video_id] = (cCounts[c.video_id] || 0) + 1);
    const vidMap = Object.fromEntries((likedVidsRes.data || []).map(v => [v.id, v]));

    const posted = postedRows.map(v => ({
      id: v.id, name: v.title, src: v.video_url,
      likesCount: lCounts[v.id] || 0, commentsCount: cCounts[v.id] || 0
    }));
    const liked = likedIds.map(id => vidMap[id]).filter(Boolean).map(v => ({
      id: v.id, name: v.title, src: v.video_url,
      likesCount: lCounts[v.id] || 0, commentsCount: cCounts[v.id] || 0
    }));
    const comments = myCmts.map(c => ({
      ...c, videoName: vidMap[c.video_id]?.title || "Video", createdAt: c.created_at
    }));
    const likesReceived = posted.reduce((sum, v) => sum + v.likesCount, 0);

    acctData = { posted, liked, comments };
    $("st-following").textContent = followingRes.count || 0;
    $("st-followers").textContent = followersRes.count || 0;
    $("st-likes").textContent = likesReceived;
    $("st-comments").textContent = comments.length;
    renderAccountTab();
  } catch (e) {
    $("acct-content").innerHTML = `<div class="empty-box">Could not load account data.<br>${escapeHtml(e.message)}</div>`;
  }
}

function renderAccountTab() {
  const box = $("acct-content");
  if (!acctData) return;
  if (acctTab === "comments") {
    if (!acctData.comments.length) { box.innerHTML = '<div class="empty-box">No comments yet.</div>'; return; }
    const list = document.createElement("div");
    list.className = "cmt-feed";
    acctData.comments.forEach(c => {
      const card = document.createElement("div");
      card.className = "cmt-card";
      card.innerHTML = `<div class="meta"><b>On: ${escapeHtml(c.videoName)}</b><span>${new Date(c.createdAt).toLocaleDateString()}</span></div><div>${escapeHtml(c.text)}</div>`;
      card.onclick = () => location.href = `/scroll#v=${encodeURIComponent(c.video_id)}`;
      list.appendChild(card);
    });
    box.innerHTML = ""; box.appendChild(list);
    return;
  }
  const vids = acctTab === "liked" ? acctData.liked : acctData.posted;
  if (!vids.length) {
    box.innerHTML = `<div class="empty-box">${acctTab === "liked" ? "No liked videos yet." : "No posted videos yet."}</div>`;
    return;
  }
  const grid = document.createElement("div");
  grid.className = "vid-grid";
  vids.forEach(v => {
    const tile = document.createElement("div");
    tile.className = "vid-tile";
    tile.innerHTML = `<video src="${v.src}" muted playsinline preload="metadata"></video>
      <div class="v-ov"><b>${escapeHtml(v.name)}</b><span>♥ ${v.likesCount} · 💬 ${v.commentsCount}</span></div>`;
    tile.onclick = () => location.href = `/scroll#v=${encodeURIComponent(v.id)}`;
    grid.appendChild(tile);
  });
  box.innerHTML = ""; box.appendChild(grid);
}

document.querySelectorAll(".tab").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b === btn));
    acctTab = btn.dataset.tab;
    renderAccountTab();
  };
});

/* ---------- Followers / Following Modal ---------- */
async function openFollowModal(mode) {
  $("fl-title").textContent = mode === "followers" ? "Followers" : "Following";
  $("fl-list").innerHTML = '<div style="color:var(--muted);padding:12px">Loading…</div>';
  $("followListDlg").showModal();

  const col = mode === "followers" ? "follower_id" : "following_id";
  const filterCol = mode === "followers" ? "following_id" : "follower_id";
  const { data: rows } = await sb.from("follows").select(col).eq(filterCol, targetId);
  const ids = (rows || []).map(r => r[col]);
  if (!ids.length) {
    $("fl-list").innerHTML = `<div style="color:var(--muted);padding:12px">No ${mode} yet.</div>`;
    return;
  }
  const { data: profs } = await sb.from("profiles").select("id, username, display_name, avatar_url").in("id", ids);
  const list = $("fl-list");
  list.innerHTML = "";
  (profs || []).forEach(p => {
    const row = document.createElement("div");
    row.className = "u-row";
    const init = escapeHtml((p.display_name || p.username || "U")[0].toUpperCase());
    const av = p.avatar_url ? `style="background-image:url(${escapeHtml(p.avatar_url)})"` : "";
    const btnHtml = (user && p.id !== user.id)
      ? `<button class="btn sm ${myFollowing.has(p.id) ? "tonal" : "primary"}" data-uid="${p.id}">${myFollowing.has(p.id) ? (myFollowers.has(p.id) ? "Friends" : "Following") : (myFollowers.has(p.id) ? "Follow back" : "Follow")}</button>`
      : "";
    row.innerHTML = `<div class="u-av" ${av}>${p.avatar_url ? "" : init}</div>
      <a class="u-meta" href="/profile?u=${encodeURIComponent(p.username)}"><b>${escapeHtml(p.display_name || p.username)}</b><small>@${escapeHtml(p.username)}</small></a>
      ${btnHtml}`;
    const fbtn = row.querySelector("button");
    if (fbtn) fbtn.onclick = async () => {
      const was = myFollowing.has(p.id);
      if (was) {
        await sb.from("follows").delete().eq("follower_id", user.id).eq("following_id", p.id);
        myFollowing.delete(p.id);
      } else {
        await sb.from("follows").insert({ follower_id: user.id, following_id: p.id });
        myFollowing.add(p.id);
      }
      const nowF = myFollowing.has(p.id);
      fbtn.className = "btn sm " + (nowF ? "tonal" : "primary");
      fbtn.textContent = nowF ? (myFollowers.has(p.id) ? "Friends" : "Following") : (myFollowers.has(p.id) ? "Follow back" : "Follow");
      if (isMe) $("st-following").textContent = myFollowing.size;
    };
    list.appendChild(row);
  });
}
$("btn-followers-list").onclick = () => openFollowModal("followers");
$("btn-following-list").onclick = () => openFollowModal("following");

/* ---------- Batch Upload ---------- */
let upQueue = [];
function uploadToBucket(storagePath, file, token, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open("POST", `${SUPABASE_URL}/storage/v1/object/videos/${storagePath}`);
    xhr.setRequestHeader("apikey", SUPABASE_ANON_KEY);
    xhr.setRequestHeader("Authorization", `Bearer ${token}`);
    xhr.setRequestHeader("Content-Type", file.type || "video/mp4");
    xhr.setRequestHeader("x-upsert", "true");
    xhr.timeout = 120000;
    xhr.upload.onprogress = e => { if (e.lengthComputable && onProgress) onProgress(Math.round((e.loaded / e.total) * 100)); };
    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) resolve();
      else { let msg = `Upload failed (${xhr.status})`; try { msg = JSON.parse(xhr.responseText).message || msg; } catch {} reject(new Error(msg)); }
    };
    xhr.onerror = () => reject(new Error("Network error during upload."));
    xhr.ontimeout = () => reject(new Error("Upload timed out. Try a smaller video."));
    xhr.send(file);
  });
}
function renderUpQueue() {
  const q = $("upQueue");
  q.innerHTML = "";
  upQueue.forEach((item, idx) => {
    const row = document.createElement("div");
    row.className = "up-item";
    const mb = (item.file.size / (1024 * 1024)).toFixed(1);
    const over = item.file.size > 50 * 1024 * 1024;
    row.innerHTML = `<div class="up-item-top">
        <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(item.file.name)} (${mb} MB)</span>
        <span data-st="${idx}" style="font-weight:700;color:${over ? "var(--bad)" : "var(--primary)"}">${over ? "Over 50 MB" : escapeHtml(item.status || "Ready")}</span>
      </div>
      <div class="up-item-row">
        <input type="text" value="${escapeHtml(item.title)}" placeholder="Caption / Title" maxlength="100">
        <button type="button" class="btn icon" style="width:36px;height:36px;flex-shrink:0" title="Remove">✕</button>
      </div>`;
    row.querySelector("input").oninput = e => { item.title = e.target.value; };
    row.querySelector("button").onclick = () => { upQueue.splice(idx, 1); renderUpQueue(); };
    q.appendChild(row);
  });
}
function openUpload() {
  upQueue = [];
  $("upFile").value = ""; $("upHint").textContent = "";
  $("upHint").className = "hint"; $("upSubmit").disabled = false;
  renderUpQueue();
  $("uploadDlg").showModal();
}
$("openUpload").onclick = openUpload;
$("btn-upload-acct").onclick = openUpload;
$("upFile").onchange = e => {
  [...(e.target.files || [])].forEach(file => {
    const defTitle = file.name.replace(/\.[^.]+$/, "").replace(/[-_]+/g, " ").trim().slice(0, 100);
    upQueue.push({ file, title: defTitle, status: "Ready" });
  });
  renderUpQueue();
};
$("upSubmit").onclick = async () => {
  const valid = upQueue.filter(it => it.file.size <= 50 * 1024 * 1024);
  if (!valid.length) {
    $("upHint").textContent = upQueue.length ? "All selected videos exceed the 50 MB limit." : "Pick one or more video files first.";
    $("upHint").className = "hint bad";
    return;
  }
  $("upSubmit").disabled = true; $("upHint").className = "hint";
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session?.access_token) throw new Error("Session expired. Sign in again.");
    let okCount = 0;
    for (let i = 0; i < upQueue.length; i++) {
      const item = upQueue[i];
      if (item.file.size > 50 * 1024 * 1024) { item.status = "Skipped (>50 MB)"; continue; }
      const stEl = document.querySelector(`[data-st="${i}"]`);
      const setSt = txt => { item.status = txt; if (stEl) stEl.textContent = txt; };
      try {
        const ext = (item.file.name.match(/\.(mp4|webm|mov)$/i)?.[0] || ".mp4").toLowerCase();
        const safe = item.file.name.replace(/\.[^.]+$/, "").replace(/[^a-zA-Z0-9_-]+/g, "-").slice(0, 40) || "video";
        const storagePath = `${user.id}/${Date.now()}-${i}-${safe}${ext}`;
        await uploadToBucket(storagePath, item.file, session.access_token, pct => {
          setSt(`${pct}%`);
          $("upHint").textContent = `Uploading ${i + 1} of ${upQueue.length} (${pct}%)…`;
        });
        setSt("Saving…");
        const videoUrl = sb.storage.from("videos").getPublicUrl(storagePath).data.publicUrl;
        const title = item.title.trim() || safe.replace(/[-_]+/g, " ");
        const { error: dbErr } = await sb.from("videos").insert({ user_id: user.id, title, video_url: videoUrl, storage_path: storagePath });
        if (dbErr) throw dbErr;
        setSt("Done");
        okCount++;
      } catch (err) {
        setSt("Failed");
        if (stEl) stEl.style.color = "var(--bad)";
        console.warn(err);
      }
    }
    if (okCount === upQueue.length) {
      $("uploadDlg").close();
      await loadAccountData();
    } else {
      $("upSubmit").disabled = false;
      $("upHint").textContent = `Uploaded ${okCount} of ${upQueue.length} videos.`;
      if (okCount > 0) await loadAccountData();
    }
  } catch (e) {
    $("upSubmit").disabled = false; $("upHint").textContent = e.message; $("upHint").className = "hint bad";
  }
};

/* ---------- Edit Profile ---------- */
let editAvatarData = null;
$("btn-edit-prof").onclick = () => {
  editAvatarData = null;
  $("ep-display").value = profile.display_name || "";
  $("ep-user").value = profile.username || "";
  $("ep-bio").value = profile.bio || "";
  $("ep-hint").textContent = ""; $("ep-hint").className = "hint";
  if (profile.avatar_url) { $("ep-av").style.backgroundImage = `url(${profile.avatar_url})`; $("ep-av").textContent = ""; }
  else { $("ep-av").style.backgroundImage = ""; $("ep-av").textContent = "📷"; }
  $("editProfDlg").showModal();
};
$("ep-av").onclick = () => $("ep-file").click();
$("ep-file").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image();
  img.onload = () => {
    const c = document.createElement("canvas"); c.width = c.height = 256;
    const s = Math.min(img.width, img.height);
    c.getContext("2d").drawImage(img, (img.width-s)/2, (img.height-s)/2, s, s, 0, 0, 256, 256);
    editAvatarData = c.toDataURL("image/jpeg", .85);
    $("ep-av").style.backgroundImage = `url(${editAvatarData})`; $("ep-av").textContent = "";
  };
  img.src = URL.createObjectURL(f);
};
$("ep-save").onclick = async () => {
  const dn = $("ep-display").value.trim(), un = $("ep-user").value.trim().toLowerCase(), bio = $("ep-bio").value.trim();
  if (!/^[a-z0-9_.]{3,20}$/.test(un)) { $("ep-hint").textContent = "Username must be 3–20 chars (a–z, 0–9, _ or .)."; $("ep-hint").className = "hint bad"; return; }
  $("ep-save").disabled = true; $("ep-hint").textContent = "Saving…";
  try {
    let avatar_url = profile.avatar_url;
    if (editAvatarData) {
      const blob = await (await fetch(editAvatarData)).blob();
      const path = user.id + "/avatar.jpg";
      await sb.storage.from("avatars").upload(path, blob, { upsert: true, contentType: "image/jpeg" });
      avatar_url = sb.storage.from("avatars").getPublicUrl(path).data.publicUrl + "?t=" + Date.now();
    }
    await sb.from("profiles").upsert({ id: user.id, username: un, display_name: dn || un, bio, avatar_url });
    await resolveTargetAndLoad();
    $("editProfDlg").close();
  } catch (e) {
    $("ep-hint").textContent = e.message || "Could not save profile."; $("ep-hint").className = "hint bad";
  } finally { $("ep-save").disabled = false; }
};

/* ---------- Settings ---------- */
function renderSettings() {
  const t = getTheme();
  $("st-mode").value = t.mode || "auto";
  $("st-custom-color").value = t.color || "#7b3f8c";
  const sw = $("st-swatches"); sw.innerHTML = "";
  PRESETS.forEach(p => {
    const b = document.createElement("button");
    b.className = "swatch" + ((t.color || "#7b3f8c").toLowerCase() === p.hex ? " on" : "");
    b.style.background = p.hex; b.title = p.name;
    b.onclick = () => { saveTheme({ color: p.hex }); renderSettings(); };
    sw.appendChild(b);
  });
  const wps = $("st-wps"); wps.innerHTML = "";
  WP_PRESETS.forEach(w => {
    const b = document.createElement("button");
    b.className = "wp-opt" + ((t.wallpaper || "") === w.css ? " on" : "");
    if (w.css) b.style.backgroundImage = w.css;
    b.textContent = w.label;
    b.onclick = () => { saveTheme({ wallpaper: w.css }); renderSettings(); };
    wps.appendChild(b);
  });
}
$("btn-settings").onclick = () => { renderSettings(); $("settingsDlg").showModal(); };
$("st-mode").onchange = e => saveTheme({ mode: e.target.value });
$("st-custom-color").oninput = e => saveTheme({ color: e.target.value });
$("st-wp-upload").onclick = () => $("st-wp-file").click();
$("st-wp-file").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image();
  img.onload = () => {
    const c = document.createElement("canvas");
    const scale = Math.min(1280 / img.width, 1280 / img.height, 1);
    c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    saveTheme({ wallpaper: c.toDataURL("image/jpeg", .82) });
    renderSettings();
  };
  img.src = URL.createObjectURL(f);
};
$("st-reset").onclick = async () => {
  localStorage.removeItem("wt_theme");
  applyTheme({});
  if (sb && user) { try { await sb.from("profiles").update({ theme: {} }).eq("id", user.id); } catch {} }
  renderSettings();
};
$("btn-signout").onclick = async () => { try { await sb.auth.signOut(); } catch {} location.href = "/scroll"; };

function escapeHtml(s) {
  return String(s || "").replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
}

(async () => {
  if (!sb) return location.href = "/login";
  const { data } = await sb.auth.getSession();
  user = data.session?.user || null;
  await loadMyFollows();
  await resolveTargetAndLoad();
})();
</script>
